<!doctype html>
<meta charset="utf-8">
<title>manager cloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--ink:#111;--dim:#6b7280;--line:#e5e7eb;--bg:#fff}
  *{box-sizing:border-box}
  body{font:15px/1.55 system-ui,-apple-system,sans-serif;max-width:720px;margin:0 auto;padding:28px 18px 80px;color:var(--ink);background:var(--bg)}
  h1{font-size:19px;margin:0 0 2px} h2{font-size:15px;margin:22px 0 8px}
  .sub{color:var(--dim);font-size:13px;margin:0 0 18px}
  .muted{color:var(--dim);font-size:12.5px}
  .card{border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .step{display:flex;gap:12px;margin:14px 0}
  .num{flex:none;width:24px;height:24px;border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center}
  .step .b{flex:1;min-width:0}
  pre{background:#0d1117;color:#e6edf3;border-radius:10px;padding:12px 14px;overflow:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;margin:8px 0 0;white-space:pre}
  .cmdwrap{position:relative}
  .copy{position:absolute;top:8px;right:8px;border:1px solid #30363d;background:#161b22;color:#e6edf3;border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
  button{border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:9px;padding:9px 16px;font:inherit;font-size:14px;cursor:pointer}
  button.ghost{background:#fff;color:var(--ink)}
  button:disabled{opacity:.5;cursor:default}
  input,textarea{border:1px solid #ccc;border-radius:9px;padding:9px 11px;font:inherit;width:100%}
  textarea{resize:vertical}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
  .on{background:#dcfce7;color:#166534}.off{background:#f3f4f6;color:#6b7280}
  .dot{width:7px;height:7px;border-radius:999px;background:currentColor;display:inline-block}
  .waiting .dot{animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .task{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0}
  .task b{font-size:13.5px} .st{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--dim);letter-spacing:.03em}
  .warn{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:11px;padding:10px 12px;font-size:13px;margin:10px 0}
  a{color:#1d4ed8}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tok{font:12px ui-monospace,Menlo,monospace;color:var(--dim);word-break:break-all}
  .link{background:none;border:none;color:#1d4ed8;padding:0;font:inherit;font-size:12.5px;cursor:pointer}
</style>

<h1>manager cloud</h1>
<p class="sub">Drive Claude Code on your own computer from here. Nothing runs on this
site — your code and your Claude login never leave your machine.</p>

<div id="stage"></div>

<script>
const RELAY = location.origin;
function randHex(n){const a=new Uint8Array(n/2);crypto.getRandomValues(a);return[...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
let TOKEN = localStorage.getItem('mc_token');
if(!TOKEN){ TOKEN = 'sk_machine_' + randHex(24); localStorage.setItem('mc_token', TOKEN); }
let MODE = null;               // 'onboard' | 'board'
const $ = s => document.querySelector(s);
const enc = encodeURIComponent;
const esc = s => (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(p,o){ const r=await fetch(p,o); return r.json(); }

function connectCmd(){
  return `MANAGER_RELAY_URL=${RELAY} \\\n`+
         `MANAGER_MACHINE_TOKEN=${TOKEN} \\\n`+
         `MANAGER_MACHINE_NAME="$(hostname)" \\\n`+
         `python3 ~/.claude/skills/manager/relay_client.py`;
}

// ---------- onboarding: "connect your computer" ----------
function renderOnboard(){
  MODE='onboard';
  $('#stage').innerHTML = `
  <div class="card">
    <div class="row" style="justify-content:space-between">
      <b>Connect your computer</b>
      <span id="conn" class="pill off waiting"><span class="dot"></span>waiting for your computer…</span>
    </div>
    <div class="step"><div class="num">1</div><div class="b">
      <div>Make sure that computer has <a href="https://www.anthropic.com/claude-code" target="_blank">Claude Code</a>
      installed &amp; signed in, the <b>manager</b> skill installed, and you've opened the panel for a project at least once
      (<span class="muted">so the local daemon is running</span>).</div>
    </div></div>
    <div class="step"><div class="num">2</div><div class="b">
      <div>Paste this into a terminal on that computer:</div>
      <div class="cmdwrap"><button class="copy" onclick="copyCmd(this)">Copy</button><pre id="cmd">${esc(connectCmd())}</pre></div>
    </div></div>
    <div class="step"><div class="num">3</div><div class="b">
      <div>This page flips to your board automatically the moment it connects.</div>
      <div class="muted" style="margin-top:6px">This machine token is generated for you and saved in this browser —
        keep it private (it's what pairs your computer). <button class="link" onclick="resetToken()">reset token</button></div>
    </div></div>
  </div>`;
}
function copyCmd(btn){ navigator.clipboard.writeText(connectCmd()).then(()=>{ btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',1400); }); }
function resetToken(){ TOKEN='sk_machine_'+randHex(24); localStorage.setItem('mc_token',TOKEN); MODE=null; renderOnboard(); }

// ---------- board: the connected machine ----------
function renderBoardShell(name){
  MODE='board';
  $('#stage').innerHTML = `
  <div class="row" style="justify-content:space-between;margin-bottom:6px">
    <span class="pill on"><span class="dot"></span>${esc(name||'machine')} · online</span>
    <span id="arm" class="pill off">arm: ?</span>
  </div>
  <div class="card">
    <b>Send work to this computer</b>
    <textarea id="doc" rows="3" style="margin-top:8px" placeholder="A Notion URL, a PDF/.md path on that computer, or type tasks one per line."></textarea>
    <div class="row" style="margin-top:8px"><button onclick="sendDoc(this)">Send → run /manager</button>
      <span id="sent" class="muted"></span>
      <button class="link" style="margin-left:auto" onclick="MODE=null;renderOnboard()">connection command</button></div>
    <div id="armwarn"></div>
  </div>
  <div id="board"></div>`;
}
async function sendDoc(btn){
  const doc=$('#doc').value.trim(); if(!doc) return;
  btn.disabled=true; $('#sent').textContent='sending…';
  const r=await api('/api/dash/command',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,type:'post_intake',payload:{answer:doc}})});
  btn.disabled=false; $('#sent').textContent=r.ok?'sent to your computer ✓':'failed'; $('#doc').value='';
}
function taskCard(t){ return `<div class="task"><span class="st">${esc(t.status)}${t.tier!=null?' · tier '+t.tier:''}</span>
  <div><b>${esc(t.title)}</b></div>${t.pr_url?`<a href="${esc(t.pr_url)}" target="_blank">${esc(t.pr_url)}</a>`:''}</div>`; }
function updateBoard(st){
  const proj=st.project||{}, armed=!!proj.armed;
  const a=$('#arm'); if(a){ a.className='pill '+(armed?'on':'off'); a.textContent='arm: '+(armed?'on':'off'); }
  const w=$('#armwarn'); if(w) w.innerHTML = armed?'' :
    `<div class="warn">This computer isn't <b>armed</b> for remote runs, so sent work waits instead of starting.
     To allow it, set <code>remote_exec_armed: true</code> in that project's config.json <b>on the machine</b>
     (only doable there, never from here — that's the safety boundary).</div>`;
  const live=(st.progress&&st.progress.steps||[]).slice(-1)[0];
  const feed=live?`<div class="task"><span class="st">activity</span><div>${esc(live.label)}</div>${live.detail?`<div class="muted">${esc(live.detail)}</div>`:''}</div>`:'';
  const tasks=st.tasks||[];
  $('#board').innerHTML = feed + `<h2>Tasks · ${tasks.length}</h2>` + (tasks.length?tasks.map(taskCard).join(''):`<p class="muted">Nothing yet — send a task doc above.</p>`);
}

async function poll(){
  let d; try{ d=await api('/api/dash/state?token='+enc(TOKEN)); }catch(e){ return; }
  if(d.online){ if(MODE!=='board') renderBoardShell(d.name); updateBoard(d.state||{}); }
  else{ if(MODE!=='onboard') renderOnboard(); }
}
setInterval(poll,2000); poll();
</script>
