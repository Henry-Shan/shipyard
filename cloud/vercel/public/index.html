<!doctype html>
<meta charset="utf-8">
<title>manager cloud</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--paper:#FBF3DE;--ink:#141210;--dim:#6b6459;--line:#141210;--yellow:#FFE14D;
        --ready:#178A46;--prog:#1E48E0;--fail:#C4183C;--wait:#B27B00}
  *{box-sizing:border-box}
  body{font:15px/1.55 system-ui,-apple-system,sans-serif;color:var(--ink);margin:0;background:var(--paper);
    background-image:radial-gradient(rgba(20,18,16,.10) 1.3px,transparent 1.3px);background-size:22px 22px}
  .wrap{max-width:760px;margin:0 auto;padding:30px 18px 90px}
  .tag{display:inline-block;background:var(--yellow);border:2.5px solid var(--ink);border-radius:8px;
    padding:3px 12px;font-weight:900;font-size:18px;box-shadow:4px 4px 0 var(--ink);transform:rotate(-1.5deg)}
  .lede{font-size:14.5px;margin:16px 0 2px;max-width:58ch;color:var(--ink)}
  .muted{color:var(--dim);font-size:12.5px}
  .card{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:18px;margin:16px 0;box-shadow:5px 5px 0 var(--ink)}
  h2{font-size:15px;margin:0 0 10px;font-weight:900}
  pre{background:#141210;color:#FBF3DE;border:2.5px solid var(--ink);border-radius:10px;padding:13px 14px;overflow:auto;
    font:12.5px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;margin:0;white-space:pre}
  .cmdwrap{position:relative;margin-top:6px}
  .copy{position:absolute;top:9px;right:9px;background:var(--yellow);border:2px solid var(--ink);color:var(--ink);
    border-radius:7px;padding:3px 11px;font-size:12px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
  button{border:2.5px solid var(--ink);background:#fff;color:var(--ink);border-radius:9px;padding:8px 14px;
    font:inherit;font-size:13px;font-weight:800;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
  button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  button.primary{background:var(--yellow)} button.danger{background:var(--fail);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  textarea{width:100%;border:2.5px solid var(--ink);border-radius:10px;padding:9px 11px;font:inherit;font-size:13.5px;resize:vertical;background:#fff}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:3px 11px;border-radius:999px;border:2px solid var(--ink)}
  .on{background:#C9F5D9;color:#0d5a2c}.off{background:#eee;color:#6b6459}
  .dot{width:7px;height:7px;border-radius:999px;background:currentColor;display:inline-block}
  .waiting .dot{animation:pulse 1.1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .spacer{flex:1}
  .projrow{display:flex;align-items:center;gap:12px;background:#fff;border:2.5px solid var(--ink);border-radius:12px;
    padding:12px 14px;margin:10px 0;box-shadow:3px 3px 0 var(--ink)}
  .projrow.active{background:#FFFDF3}
  .projinfo{flex:1;min-width:0;cursor:pointer}
  .projinfo b{font-size:14px}
  .projpath{font:12px ui-monospace,Menlo,monospace;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cap{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;padding:2px 6px;font-size:12px;font-weight:800}
  .capb{border:none;box-shadow:none;background:none;padding:0 5px;font-size:15px;cursor:pointer}
  .task{background:#fff;border:2.5px solid var(--ink);border-radius:12px;padding:11px 13px;margin:9px 0;box-shadow:3px 3px 0 var(--ink)}
  .st{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;border:2px solid var(--ink);border-radius:6px;padding:1px 7px;display:inline-block}
  .qcard{background:#FFFDF5;border:2.5px solid var(--ink);border-radius:12px;padding:14px;margin:12px 0;box-shadow:4px 4px 0 var(--ink)}
  .qh{font-size:12px;font-weight:900;color:var(--dim);text-transform:uppercase;letter-spacing:.03em}
  .qq{font-weight:900;font-size:15px;margin:5px 0}
  .warn{background:#FFF3C4;border:2.5px solid var(--ink);border-radius:10px;padding:9px 11px;font-size:12.5px;margin-top:9px;box-shadow:3px 3px 0 var(--ink)}
  a{color:var(--prog)} code{background:#f1e9d0;border:1px solid var(--ink);border-radius:4px;padding:0 4px;font-size:12px}
  .link{background:none;border:none;box-shadow:none;color:var(--prog);padding:0;font-weight:800;font-size:12.5px;cursor:pointer}
</style>

<div class="wrap">
  <span class="tag">manager cloud</span>
  <div id="stage"></div>
</div>

<script>
const RELAY=location.origin;
function randHex(n){const a=new Uint8Array(n/2);crypto.getRandomValues(a);return[...a].map(b=>b.toString(16).padStart(2,'0')).join('')}
let TOKEN=localStorage.getItem('mc_token'); if(!TOKEN){TOKEN='sk_machine_'+randHex(24);localStorage.setItem('mc_token',TOKEN);}
let VIEW='onboard', LAST=null, ONB_SIG='', PROJ_SIG='', BOARD_READY=false, Q_SIG='';
const $=s=>document.querySelector(s), enc=encodeURIComponent;
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(p,o){const r=await fetch(p,o);return r.json();}
function ago(t){if(!t)return'';const s=Math.max(0,Date.now()/1000-t);
  if(s<60)return'just now';if(s<3600)return Math.round(s/60)+'m ago';if(s<86400)return Math.round(s/3600)+'h ago';return Math.round(s/86400)+'d ago';}
async function sendCmd(type,payload){return api('/api/dash/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN,type,payload:payload||{}})});}

function connectCmd(){return `MANAGER_RELAY_URL=${RELAY} \\\n`+
  `MANAGER_MACHINE_TOKEN=${TOKEN} \\\n`+
  `MANAGER_MACHINE_NAME="$(hostname)" \\\n`+
  `python3 ~/.claude/skills/manager/relay_client.py`;}
function copyCmd(btn){navigator.clipboard.writeText(connectCmd()).then(()=>{btn.textContent='Copied ✓';setTimeout(()=>btn.textContent='Copy',1400);});}
function resetToken(){TOKEN='sk_machine_'+randHex(24);localStorage.setItem('mc_token',TOKEN);ONB_SIG='';go('onboard');}

// ---------- ONBOARD: just the install command + connection check ----------
function renderOnboard(online){
  const sig='onb:'+online; if(sig===ONB_SIG)return; ONB_SIG=sig;
  $('#stage').innerHTML=`
  <p class="lede">Drive Claude Code on your own computer. Paste this into a terminal there —
  it runs on your machine, your code and Claude login never leave it.</p>
  <div class="card">
    <div class="cmdwrap"><button class="copy" onclick="copyCmd(this)">Copy</button><pre>${esc(connectCmd())}</pre></div>
    <div class="bar" style="margin-top:14px">
      ${online
        ? `<span class="pill on"><span class="dot"></span>connected</span>
           <button class="primary" style="margin-left:auto;font-size:15px;padding:10px 18px" onclick="go('projects')">Open your projects →</button>`
        : `<span class="pill off waiting"><span class="dot"></span>waiting for your computer to connect…</span>`}
    </div>
    <div class="muted" style="margin-top:12px">Needs <a href="https://www.anthropic.com/claude-code" target="_blank">Claude Code</a>
      installed &amp; signed in and the <b>manager</b> skill, with the panel opened once for a project.
      Token saved in this browser — keep it private. <button class="link" onclick="resetToken()">reset</button></div>
  </div>`;
}

// ---------- PROJECTS: the home page ----------
function renderProjects(st){
  const projects=st.projects||[];
  const sig=JSON.stringify(projects.map(p=>[p.slug,p.push_mode,p.active]));
  if(sig===PROJ_SIG)return; PROJ_SIG=sig;
  const rows=projects.map(p=>{
    const local=p.push_mode==='local';
    return `<div class="projrow${p.active?' active':''}">
      <div class="projinfo" onclick="openProject('${esc(p.slug)}',${p.active})">
        <b>${esc(p.name)}</b>${p.active?' <span class="muted">● active</span>':''}
        <div class="projpath">${esc(p.path)}</div></div>
      <button onclick="togglePush('${esc(p.slug)}','${esc(p.push_mode||'pr')}')" title="finished work: PR opens a GitHub PR; Local stops at a committed branch">${local?'💻 Local':'⇧ PR'}</button>
      ${p.active?'':`<button class="primary" onclick="openProject('${esc(p.slug)}',false)">Open →</button>`}
      <button class="danger" title="stop tracking this project (never touches your repo, branches, or PRs)" onclick="removeProj('${esc(p.slug)}','${esc(p.name)}')">🗑</button>
    </div>`;}).join('') || `<p class="muted">No projects yet — open the manager panel for a repo on your computer and it'll appear here.</p>`;
  $('#stage').innerHTML=`<div class="bar" style="margin-top:14px"><h2 style="margin:0">📁 Your projects</h2>
    <div class="spacer"></div><button class="link" onclick="go('onboard')">connection</button></div>${rows}`;
}
function openProject(slug,active){ if(!active) sendCmd('activate_project',{slug}); BOARD_READY=false; go('board'); }
function togglePush(slug,cur){ sendCmd('set_push_mode',{slug,push_mode:cur==='local'?'pr':'local'}); PROJ_SIG=''; }
function removeProj(slug,name){ if(confirm(`Stop tracking "${name}"?\n\nRemoves it from this list only — your repo, git history, branches and PRs are never touched.`)){ sendCmd('remove_project',{slug}); PROJ_SIG=''; } }

// ---------- BOARD: one project's Review board ----------
function renderBoardShell(){
  BOARD_READY=true; Q_SIG='';
  $('#stage').innerHTML=`
  <div class="bar" style="margin-top:12px">
    <button class="link" onclick="go('projects')">← projects</button>
    <span class="tag" style="font-size:14px">Review</span><span id="sub" class="muted"></span>
    <span class="pill on"><span class="dot"></span>live</span>
    <div class="spacer"></div>
    <span class="cap">conc<button class="capb" onclick="bumpCap(-1)">−</button><b id="capv">1</b><button class="capb" onclick="bumpCap(1)">+</button></span>
    <button id="pausebtn" onclick="togglePause()">⏸ Pause</button>
    <button class="danger" onclick="clearAll()">🗑 Clear</button>
  </div>
  <div class="bar" style="margin-bottom:2px"><span id="mach" class="muted"></span><span id="arm" class="pill off">arm: ?</span></div>
  <div id="qcard"></div><div id="board"></div>`;
}
let CAPV=1,PAUSED=false;
function bumpCap(d){const n=Math.max(1,CAPV+d);CAPV=n;$('#capv').textContent=n;sendCmd('set_cap',{cap:n});}
function togglePause(){sendCmd(PAUSED?'resume':'pause');}
function clearAll(){if(confirm('Remove ALL tasks, questions and history from this project’s board?\n\nGit worktrees untouched. Can’t be undone.'))sendCmd('clear_all');}
async function sendDoc(btn){
  const doc=$('#docbox').value.trim();if(!doc)return;
  btn.disabled=true;$('#sent').textContent='sending…';
  const r=await sendCmd('post_intake',{answer:doc});$('#docbox').value='';
  const id=r&&r.id;
  for(let i=0;i<8&&id;i++){                     // wait for the machine's actual outcome
    await new Promise(z=>setTimeout(z,700));
    let rr;try{rr=await api('/api/dash/result?token='+enc(TOKEN)+'&cmd_id='+id);}catch(e){continue;}
    const res=rr&&rr.result;if(!res)continue;
    if(res.started)$('#sent').textContent='▶ started on your machine';
    else if(res.refused==='not_armed')$('#sent').textContent='⚠ not started — machine isn’t armed (see below)';
    else if(res.ok===false)$('#sent').textContent='not started'+(res.error?': '+res.error:'');
    else $('#sent').textContent='sent ✓';
    btn.disabled=false;return;
  }
  btn.disabled=false;$('#sent').textContent='sent — waiting for your machine';
}
function taskCard(t){const c={done:'var(--ready)',running:'var(--prog)',failed:'var(--fail)',needs_input:'var(--wait)'}[t.status]||'var(--ink)';
  return `<div class="task"><span class="st" style="color:${c}">${esc(t.status)}${t.tier!=null?' · T'+t.tier:''}</span>
    <div style="margin-top:5px"><b>${esc(t.title)}</b></div>${t.pr_url?`<a href="${esc(t.pr_url)}" target="_blank">${esc(t.pr_url)}</a>`:''}</div>`;}
function updateBoard(st){
  const proj=st.project||{},armed=!!proj.armed;
  PAUSED=!!st.paused;CAPV=st.cap||CAPV||1;$('#capv').textContent=CAPV;
  $('#pausebtn').textContent=PAUSED?'▶ Resume':'⏸ Pause';$('#pausebtn').className=PAUSED?'primary':'';
  const a=$('#arm');a.className='pill '+(armed?'on':'off');a.textContent='arm: '+(armed?'on':'off');
  $('#mach').textContent=proj.repo_name?('project: '+proj.repo_name):'';
  const q=(st.questions||[]).filter(x=>x.status==='pending');
  const tasks=(st.tasks||[]).filter(t=>t.status!=='rejected');
  $('#sub').textContent=q.length?'waiting for you':(tasks.some(t=>t.status==='running')?tasks.length+' tasks':'');
  const sig=JSON.stringify(q.map(x=>[x.id,x.status]));
  if(sig!==Q_SIG){Q_SIG=sig;const iq=q.find(x=>/Task docs/i.test(x.question))||q[0];
    $('#qcard').innerHTML=iq?`<div class="qcard"><div class="qh">Claude asks${iq.created_at?' · '+ago(iq.created_at):''}</div>
      <div class="qq">${esc(iq.question)}</div>
      ${iq.context?`<div class="muted" style="white-space:pre-wrap">${esc(iq.context)}</div>`:''}
      <textarea id="docbox" rows="2" style="margin-top:8px" placeholder="Notion URL, a PDF/.md path on your computer, or type tasks — one per line"></textarea>
      <div class="bar" style="margin-top:8px"><button class="primary" onclick="sendDoc(this)">Send reply</button><span id="sent" class="muted"></span></div>
      ${armed?'':'<div class="warn">Not <b>armed</b> — this waits until you set <code>remote_exec_armed: true</code> in the project’s config.json <b>on the machine</b>. Machine-only, on purpose.</div>'}
    </div>`:'';}
  $('#board').innerHTML=`<h2 style="margin-top:14px">Tasks · ${tasks.length}</h2>`+
    (tasks.length?tasks.map(taskCard).join(''):`<p class="muted">Nothing yet — reply above to start a batch.</p>`);
}

// ---------- routing ----------
function go(v){ VIEW=v; ONB_SIG=PROJ_SIG=''; BOARD_READY=false; route(); }
function route(){
  const online=LAST&&LAST.online, st=(LAST&&LAST.state)||{};
  if(!online){ VIEW='onboard'; renderOnboard(false); return; }
  if(VIEW==='onboard'){ renderOnboard(true); return; }
  if(VIEW==='projects'){ renderProjects(st); return; }
  if(VIEW==='board'){ if(!BOARD_READY) renderBoardShell(); updateBoard(st); return; }
}
async function poll(){ try{ LAST=await api('/api/dash/state?token='+enc(TOKEN)); }catch(e){ return; } route(); }
setInterval(poll,2000); poll();
</script>
