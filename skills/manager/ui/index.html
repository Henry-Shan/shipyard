<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manager · ship-task control panel</title>
<style>
  :root{
    --bg:#0e1512; --panel:#152019; --panel2:#1b2820; --line:#27362c;
    --ink:#e8f0ea; --dim:#8aa394; --primary:#1f9d63; --primaryd:#0A5C3D;
    --amber:#e0a128; --red:#e05a4f; --blue:#4f8fe0;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);overflow-x:hidden;
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  header{display:flex;align-items:center;gap:12px 14px;padding:14px 22px;flex-wrap:wrap;
    background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  header h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--dim);font-size:12px}
  .stats{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;
    padding:3px 11px;font-size:12px;color:var(--dim);cursor:pointer;user-select:none;
    transition:border-color .15s,color .15s}
  .chip:hover{border-color:var(--primary);color:var(--ink)}
  .chip b{color:var(--ink)}
  @keyframes flashsec{0%{background:#11341f;border-color:var(--primary)}
    100%{background:var(--panel);border-color:var(--line)}}
  .flash .card{animation:flashsec 1.1s ease-out}
  .flash h2,h2.flash{animation:flashsec 1.1s ease-out}
  main{display:block;max-width:860px;margin:0 auto;padding:18px 22px}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--dim);
    margin:0 0 10px;font-weight:650}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:11px;padding:14px 16px;margin-bottom:11px}
  /* per-status card accents (a left bar + a faint tint) — matches the section */
  .card.s-running,.card.s-parked{border-color:#2a4a66;border-left-color:var(--blue);background:#12283c}
  .card.s-failed{border-color:#5a2a26;border-left-color:var(--red);background:#2e1512}
  .card.s-done{border-color:#1d4d36;border-left-color:var(--primary);background:#0f2c1c}
  .card.s-queued{border-left-color:#33433a}
  .card.s-blocked{border-left-color:#4a4030;opacity:.92}
  .task{display:flex;gap:12px;align-items:flex-start}
  .task .meta{flex:1;min-width:0}
  .task .title{font-weight:600;margin:0 0 2px}
  .task .desc{color:var(--dim);font-size:12.5px;margin:2px 0 6px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--dim)}
  .badge{border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600;border:1px solid var(--line)}
  .b-draft{color:var(--dim)} .b-queued{color:var(--blue);border-color:#274260}
  .b-running{color:var(--primary);border-color:#1d4d36}
  .b-parked{color:var(--amber);border-color:#5a4720}
  .b-done{color:var(--primary);border-color:#1d4d36;background:#10241a}
  .b-failed{color:var(--red);border-color:#5a2a26}
  .b-blocked{color:var(--dim)} .b-rejected{color:var(--dim);text-decoration:line-through}
  .tier{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-weight:600}
  .src{font-style:italic;opacity:.8}
  button{font:inherit;cursor:pointer;border-radius:7px;border:1px solid var(--line);
    background:var(--panel2);color:var(--ink);padding:5px 11px}
  button:hover{border-color:var(--primary)}
  button.primary{background:var(--primaryd);border-color:var(--primary)}
  button.ghost{background:transparent}
  .acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .q{border-left:3px solid var(--amber)}
  .q textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);
    border-radius:7px;padding:7px;font:inherit;resize:vertical;margin:7px 0}
  .opts{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
  .opts button{padding:3px 9px;font-size:12px}
  .ctx{font-size:12px;color:var(--dim);margin:4px 0}
  .ctitle{display:flex;gap:9px;align-items:center;line-height:1.3}
  .ctitle>.t{flex:1;min-width:0;font-weight:650;font-size:14.5px;color:var(--ink)}
  .cmeta{font-size:11.5px;color:var(--dim);margin:6px 0 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .creason{font-size:12.5px;color:var(--dim);margin:6px 0 0;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .applink{color:var(--primary);font-weight:600;text-decoration:none;font-size:12.5px}
  .prog{margin:7px 0 0;font-size:12px;color:#bfe8d0;background:#10241a;border:1px solid #1d4d36;
    border-radius:7px;padding:6px 9px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre-line;overflow:hidden;line-height:1.5;
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
  .prog.err{color:#f0b3ad;background:#2a1311;border-color:#5a2a26;-webkit-line-clamp:3}
  .capctl{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim)}
  .capctl .caplbl{margin-right:3px}
  .capctl button{padding:1px 9px;font-size:14px;line-height:1.2}
  .capctl b{min-width:14px;text-align:center;color:var(--ink)}
  .app{margin:6px 0;font-size:12.5px}
  .app a{color:var(--primary);font-weight:600;text-decoration:none}
  .app a:hover{text-decoration:underline}
  .app.dim{color:var(--dim)}
  .sess{color:var(--dim);font-size:11px;margin-left:6px}
  .wtchip{background:#11241a;border:1px solid #1d4d36;border-radius:6px;padding:1px 7px;
    color:#bfe8d0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
  /* feature-tester verdict chip + expandable turns/output */
  .ftchip{border-radius:999px;padding:1px 8px;font-size:10.5px;font-weight:600;
    border:1px solid var(--line);vertical-align:middle;white-space:nowrap}
  .ft-pass{color:#9be8b8;background:#10241a;border-color:#1d4d36}
  .ft-skipped{color:var(--dim);background:var(--panel2)}
  .ft-blocked{color:var(--amber);background:#241c0e;border-color:#5a4720}
  .ft-fail{color:#f0b3ad;background:#2a1311;border-color:#5a2a26}
  .ftdetail{margin:7px 0 0;font-size:12px}
  .ftdetail>summary{cursor:pointer;color:var(--dim);list-style:none}
  .ftdetail[open]>summary{color:var(--ink);margin-bottom:5px}
  .ftturns{margin:0 0 0 2px;padding-left:16px;color:#cfe3d7;line-height:1.5}
  .ftturns i{color:var(--dim);font-style:normal}
  .ftout{margin:6px 0 0;padding:7px 9px;background:#0c1c14;border:1px solid var(--line);
    border-radius:7px;font-size:11px;color:#bcd;white-space:pre-wrap;max-height:160px;overflow:auto}
  .thumbs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 0}
  .thumb{height:48px;width:auto;max-width:90px;border-radius:7px;border:1px solid var(--line);
    object-fit:cover;cursor:pointer;display:block;background:#0c1c14}
  .thumb:hover{border-color:var(--primary)}
  .filelink{display:inline-block;background:var(--panel2);border:1px solid var(--line);
    border-radius:7px;padding:5px 9px;font-size:12px;color:var(--ink);text-decoration:none}
  .filelink:hover{border-color:var(--primary)}
  .rwbox{margin:8px 0 0}
  .rwbox textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--primary);
    border-radius:8px;padding:8px;font:inherit;resize:vertical;margin:0 0 7px}
  .prbtn{display:inline-block;background:var(--primaryd);border:1px solid var(--primary);
    color:#fff;border-radius:7px;padding:5px 11px;text-decoration:none;font-weight:600;font-size:12.5px}
  .prbtn:hover{background:var(--primary)}
  .testplan{margin:9px 0 0;border:1px solid #1d4d36;border-radius:9px;background:#0c1c14;overflow:hidden}
  .testplan summary{cursor:pointer;list-style:none;padding:7px 11px;font-size:12px;font-weight:650;
    color:#bfe8d0;display:flex;align-items:center;gap:8px;user-select:none}
  .testplan summary::-webkit-details-marker{display:none}
  .testplan summary .cp{margin-left:auto;background:var(--primaryd);border:1px solid var(--primary);
    color:#fff;border-radius:6px;padding:2px 9px;font-size:11.5px;font-weight:600}
  .testplan summary .cp:hover{background:var(--primary)}
  .testplan pre{margin:0;padding:10px 12px;border-top:1px solid #1d4d36;white-space:pre-wrap;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dcefe2;max-height:340px;overflow:auto}
  .ev{font-size:11.5px;color:var(--dim);padding:3px 0;border-bottom:1px solid var(--line)}
  .ev b{color:var(--ink);font-weight:600}
  a{color:var(--blue)}
  .lab{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
    border-radius:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-size:11.5px;font-weight:700;padding:0 5px;flex:none}
  .lab.orphan{background:transparent;border-color:var(--line);color:var(--dim)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;
    justify-content:center;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    width:min(640px,92vw);max-height:80vh;overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:12px 16px;border-bottom:1px solid var(--line);font-weight:650}
  .modal pre{margin:0;padding:14px 16px;overflow:auto;white-space:pre-wrap;flex:1;min-height:0;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;color:#dcefe2}
  .banner{background:#3a2f12;border-bottom:1px solid #5a4720;color:#e0a128;
    padding:8px 22px;font-size:13px;font-weight:600}
  .empty{color:var(--dim);font-size:12.5px;padding:10px 2px}
  .pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--primary);
    margin-right:5px;animation:p 1.4s ease-in-out infinite}
  @keyframes p{0%,100%{opacity:.3}50%{opacity:1}}

  /* ---- phone ---- */
  @media (max-width:640px){
    header{padding:10px 13px;gap:8px 8px}
    header h1{font-size:14px} header .sub{display:none}
    /* counts wrap onto their own full-width row; controls sit on the row above */
    .stats{margin-left:0;width:100%;order:5;gap:6px}
    .capctl{order:4}
    /* finger-friendly hit targets */
    button{padding:9px 13px} .capctl button{padding:4px 12px;font-size:15px}
    .opts button,.acts button{padding:8px 12px}
    .chip{padding:5px 11px}
    .prbtn,.applink,.filelink{padding:8px 12px}
    main{padding:13px 13px 64px}
    .card{padding:13px 14px;border-radius:10px}
    .ctitle>.t{font-size:14px}
    .acts{gap:8px}
    .modal{width:94vw;max-height:88vh}
    .testplan pre{max-height:50vh}
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Manager</h1>
    <div class="sub">ship-task orchestrator · grounded in your repo's shipped history</div>
  </div>
  <div class="stats" id="stats"></div>
  <span id="capctl" class="capctl"></span>
  <a href="/review" target="_blank" title="requirements (PDF) next to the live edits ship-task makes, per task"
     style="margin-left:6px;background:var(--primaryd);border:1px solid var(--primary);color:#d7f5e5;border-radius:7px;padding:5px 12px;font-size:12.5px;font-weight:600">📋 Review board ↗</a>
  <button id="reconnectbtn" class="ghost" onclick="reconnectManager(this)" style="margin-left:6px" title="copy the command to reopen the /manager orchestrator (the daemon + all tasks persist)">⧉ Reconnect</button>
  <button id="pausebtn" onclick="togglePause()" style="margin-left:6px"></button>
  <button id="clearbtn" class="ghost" onclick="clearAll(this)" style="margin-left:6px;color:#f2b8b8;border-color:#5c2b2b" title="remove ALL tasks, questions and history from the board — git worktrees are left untouched">🗑 Clear all</button>
</header>
<div id="pausebanner"></div>

<main>
  <div class="col">
    <h2 id="needshdr">Needs your input</h2>
    <div id="needs"></div>

    <h2 style="margin-top:22px" id="blockedhdr">Can't be done · needs your call</h2>
    <div id="blocked"></div>

    <h2 style="margin-top:22px" id="runninghdr">In progress</h2>
    <div id="running"></div>

    <h2 style="margin-top:22px" id="stoppedhdr">Stopped — needs your attention</h2>
    <div id="stopped"></div>

    <h2 style="margin-top:22px" id="prhdr">PR ready — merge when you're happy</h2>
    <div id="prready"></div>

    <h2 style="margin-top:22px" id="queuehdr">Queued</h2>
    <div id="queued"></div>
  </div>
</main>

<div id="modal" class="modal-bg" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-head"><span id="modal-title">…</span>
      <button class="ghost" onclick="closeModal()">Close</button></div>
    <pre id="modal-log"></pre>
  </div>
</div>

<script>
const $ = (s)=>document.querySelector(s);
// Clicking a summary chip jumps to that section and flashes it.
function goto(secId, hdrId){
  const hdr = document.getElementById(hdrId), sec = document.getElementById(secId);
  const target = (hdr && hdr.style.display!=="none") ? hdr : sec;
  if(!target) return;
  target.scrollIntoView({behavior:"smooth", block:"start"});
  for(const el of [hdr, sec]){ if(!el) continue;
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
    setTimeout(()=>el.classList.remove("flash"), 1200);
  }
}
const esc = (s)=>(s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ago = (t)=>{const d=Date.now()/1000-t;if(d<60)return Math.round(d)+"s";
  if(d<3600)return Math.round(d/60)+"m";return Math.round(d/3600)+"h";};
// Don't re-render (which wipes the DOM) while the user is selecting text to copy
// or typing in a field — that's why selections kept disappearing.
function uiBusy(){
  if(window.getSelection && String(window.getSelection()).length) return true;
  const a=document.activeElement;
  return !!(a && (a.tagName==="TEXTAREA" || a.tagName==="INPUT"));
}

async function api(path,method="GET",body){
  const o={method,headers:{"Content-Type":"application/json"}};
  if(body)o.body=JSON.stringify(body);
  return (await fetch(path,o)).json();
}
async function answer(qid,text){ if(!text)return;
  await api(`/api/questions/${qid}/answer`,"POST",{answer:text}); refresh(); }
async function setStatus(tid,status){ await api(`/api/tasks/${tid}/status`,"POST",{status}); refresh(); }
function copyTestPlan(ev,id){ ev.preventDefault(); ev.stopPropagation();
  const txt=document.getElementById(id)?.textContent||"";
  navigator.clipboard.writeText(txt).then(()=>{ const b=ev.target;
    const o=b.textContent; b.textContent="Copied ✓"; setTimeout(()=>b.textContent=o,1200); });
}
let PAUSED=true;
async function togglePause(){ await api(PAUSED?"/api/resume":"/api/pause","POST",{}); refresh(); }
// Manual, user-triggered wipe of the board (tasks + questions + history). This is
// the ONLY thing that clears the queue — starting a /manager run never does.
// Git worktrees are left untouched (remove those per-task with the Remove button).
async function clearAll(btn){
  if(!confirm("Remove ALL tasks, questions and history from the board?\n\nGit worktrees are left untouched — remove those with each task's Remove button. This can't be undone."))return;
  const label=btn?btn.textContent:"";
  if(btn){btn.disabled=true;btn.textContent="Clearing…";}
  try{
    const r=await api("/api/reset","POST",{});
    if(r&&r.ok===false)alert("Could not clear the board.");
  }catch(e){ alert("Could not clear the board: "+e); }
  finally{ if(btn){btn.disabled=false;btn.textContent=label;} refresh(); }
}
async function setCap(n){ if(n<1)return; await api("/api/cap","POST",{cap:n}); refresh(); }
// Remember which test-plan <details> the user opened, so the periodic refresh
// (which rebuilds the cards) re-renders them open instead of collapsing them.
const TESTPLAN_OPEN = new Set();
function onTestPlanToggle(id, open){ open ? TESTPLAN_OPEN.add(id) : TESTPLAN_OPEN.delete(id); }
const REWORK_OPEN = new Set();
function toggleRework(tid){ REWORK_OPEN.has(tid)?REWORK_OPEN.delete(tid):REWORK_OPEN.add(tid); refresh(); }
async function sendRework(tid){
  const v = ($(`#rw${tid}`)?.value||"").trim();
  if(!v) return;
  REWORK_OPEN.delete(tid);
  await api(`/api/tasks/${tid}/rework`,"POST",{feedback:v});
  refresh();
}
async function resumeTask(tid, btn){
  if(btn){ btn.disabled=true; btn.textContent="Resuming…"; }
  await api(`/api/tasks/${tid}/resume`,"POST",{});
  refresh();
}
function showModal(title, text){
  $("#modal-title").textContent = title;
  $("#modal-log").textContent = text;
  $("#modal").style.display = "flex";
}
function closeModal(){ $("#modal").style.display = "none"; }
async function cleanupTask(tid){
  if(!confirm("All done with this one?\n\nThis removes its git worktree and deletes the branch (only if it's already merged), then clears the task from the panel.\n\nMake sure you've MERGED the PR first.")) return;
  showModal("🧹 Cleaning up…",
    "▸ stopping its dev servers\n▸ removing the git worktree\n▸ pruning + de-registering from the workspace\n▸ deleting the branch (only if merged)\n\nworking…");
  let r; try{ r = await api(`/api/tasks/${tid}/cleanup`,"POST",{}); }
  catch(e){ r = {output:"error: "+e}; }
  $("#modal-title").textContent = "✓ Cleanup complete";
  $("#modal-log").textContent = (r.output||"").trim() || "Done.";
  refresh(); loadWorktrees();   // card + worktree drop out behind the modal
}
async function removeWorktree(slug, branch, btn){
  // Seamless: the card vanishes immediately; teardown runs in the background,
  // no confirm/result popups. (Branch is only deleted if it's already merged.)
  const card = btn && btn.closest(".card");
  if(card){ card.style.transition="opacity .15s"; card.style.opacity="0"; card.style.pointerEvents="none"; }
  try{ await api("/api/worktrees/remove","POST",{slug,branch}); }catch(e){}
  loadWorktrees();
}
let TESTSRV=null;
async function startTest(path, btn){ if(btn){btn.disabled=true;btn.textContent="Starting…";}
  await api("/api/testserver/start","POST",{path}); loadWorktrees(); }
async function stopTest(btn){ if(btn){btn.disabled=true;} await api("/api/testserver/stop","POST",{}); loadWorktrees(); }
function testHealthLine(){
  if(!TESTSRV) return "";
  // The dev server is only linkable once it's actually LISTENING on the
  // configured dev_port; before that, show the boot spinner (or the crash
  // reason from its log) instead of a connection-refused link.
  if(TESTSRV.error)
    return `<div class="prog err">✗ dev server crashed — ${esc(TESTSRV.error)}</div>`;
  if(TESTSRV.web_up)
    return `<div class="prog"><span class="pulse"></span>✓ dev server live · <a class="applink" href="${TESTSRV.web_url}" target="_blank">${TESTSRV.web_url}</a></div>`;
  return `<div class="prog">⏳ dev server starting… (first boot can take a minute)</div>`;
}
// A/B/C labels matched between task cards (left) and their worktree (right).
let TASK_LABEL = {}, WT_LABEL = {};
// Persisted letter slots: task id -> letter index. Once a task is assigned a
// slot it keeps it across deletes/refreshes; LABEL_NEXT is the next free slot.
let LABEL_IDX = {}, LABEL_NEXT = 0;
try{
  const saved = JSON.parse(localStorage.getItem("mgr_label_idx")||"{}");
  if(saved && saved.idx){ LABEL_IDX = saved.idx; LABEL_NEXT = saved.next||0; }
}catch(e){}
function saveLabels(){ try{ localStorage.setItem("mgr_label_idx", JSON.stringify({idx:LABEL_IDX,next:LABEL_NEXT})); }catch(e){} }
function letterLabel(n){ let s=""; n++; while(n>0){ n--; s=String.fromCharCode(65+(n%26))+s; n=Math.floor(n/26);} return s; }
// REPO comes from /api/state (the configured target repo) — used in every
// copy-to-terminal command so it cd's to the right place.
let REPO = "<your repo>";
function copyResume(sid, btn){
  navigator.clipboard.writeText(`cd ${REPO} && claude --resume ${sid}`).then(()=>{
    if(btn){ const o=btn.textContent; btn.textContent="copied ✓"; setTimeout(()=>btn.textContent=o,1200); }
  });
}
// Reopen the /manager orchestrator. The daemon + DB persist independently of the
// Claude session, so this resumes the registered orchestrator session if known,
// else launches a fresh /manager on this same daemon (restart-first, same queue).
let MANAGER_SESSION = null;
function reconnectManager(btn){
  const fresh = `cd ${REPO} && claude "/manager"`;
  const resume = MANAGER_SESSION ? `cd ${REPO} && claude --resume ${MANAGER_SESSION}` : null;
  // Copy the most-specific option; the modal shows BOTH so you can pick (the
  // registered id is a best-effort guess and could be the wrong session).
  navigator.clipboard.writeText(resume || fresh).then(()=>{
    if(btn){ const o=btn.textContent; btn.textContent="copied ✓"; setTimeout(()=>btn.textContent=o,1400); }
  });
  const body = (resume
    ? "Copied — resumes the registered /manager session (use this if it's the right one):\n\n  "+resume+
      "\n\nOr start a fresh orchestrator on the same daemon + queue:\n\n  "+fresh
    : "Copied — paste in a terminal:\n\n  "+fresh)+
    "\n\nThe daemon and all tasks persist independently of the Claude window — either way nothing is lost.";
  showModal("⧉ Reconnect manager", body);
}
function worktreeCard(w){
  const tied = w.task_id ? `<span class="row">↳ task #${w.task_id}: ${esc((w.task_title||'').slice(0,40))}</span>` : "";
  const b = JSON.stringify(w.branch||""), s = JSON.stringify(w.slug), pth = JSON.stringify(w.path);
  const lab = WT_LABEL[w.path]
    ? `<span class="lab">${WT_LABEL[w.path]}</span>`
    : `<span class="lab orphan" title="no matching task — leftover worktree">·</span>`;
  const isTest = TESTSRV && TESTSRV.slug===w.slug;
  const testBtn = isTest
    ? `<a class="applink" href="${TESTSRV.web_url}" target="_blank">▶ ${TESTSRV.web_url}</a> <button class="ghost" onclick="stopTest(this)">Stop test</button>`
    : `<button onclick='startTest(${pth},this)'>▶ Test this branch</button>`;
  return `<div class="card">
    <div class="title">${lab}${esc(w.slug)}</div>
    <div class="row">${esc(w.branch||'(detached)')} · <span class="sess">${esc(w.head||'')}</span></div>
    ${isTest?testHealthLine():""}
    ${tied}
    <div class="acts">${testBtn} <button class="ghost" onclick='removeWorktree(${s},${b},this)'>Remove</button></div>
  </div>`;
}
async function loadWorktrees(){
  if(uiBusy()) return;
  // Worktree list is no longer displayed; we still poll for the test-server state
  // so the per-task "Test this branch" buttons stay accurate.
  let r; try{ r=await api("/api/worktrees"); }catch(e){ return; }
  const sig = t => t ? JSON.stringify([t.worktree,t.backend_up,t.web_up,!!t.error]) : "";
  const changed = sig(TESTSRV) !== sig(r.test_server);
  TESTSRV = r.test_server;
  // When the test stack changes (started, backend came up, crashed, stopped),
  // re-render the task cards so the per-task Test button reflects reality
  // instead of sticking on "Starting…".
  if(changed) refresh();
}

function taskCard(t){
  const reason = esc(t.open_question || t.description || "");
  const tier = t.tier!=null?`<span class="tier">T${t.tier}</span>`:"";
  const src  = t.source?`<span class="src">${esc(t.source)}</span>`:"";
  const wtSlug = t.worktree ? t.worktree.split("/").pop() : "";
  const wt   = wtSlug?`<span class="wtchip">⊟ ${esc(wtSlug)}</span>`:"";
  // clickable evidence thumbnails — open the full image in a new tab
  const thumbs = (t.evidence||[]).map(p=>{
    const u = `/api/image?path=${encodeURIComponent(p)}`;
    const name = p.split('/').pop();
    const isImg = /\.(png|jpe?g|gif|webp|bmp)$/i.test(p);
    return isImg
      ? `<a href="${u}" target="_blank" title="${esc(name)}"><img class="thumb" src="${u}" loading="lazy"></a>`
      : `<a class="filelink" href="${u}" target="_blank" title="${esc(name)}">📄 ${esc(name.length>24?name.slice(0,24)+'…':name)}</a>`;
  }).join("");
  const prog = (t.progress && (t.status==="running"||t.status==="parked"))
    ? `<div class="prog"><span class="pulse"></span>${esc(t.progress)}</div>` : "";
  // why a run stopped early (session/usage limit, network drop) — shown on the card
  const stopMsg = (t.status==="failed" && t.stopped_reason)
    ? `<div class="prog err">⚠ ${esc(t.stopped_reason)}</div>` : "";
  // per-task Test button (boots ONE backend for this run's worktree); shows the
  // live URL + Stop if this worktree is the one currently being tested.
  const isTest = TESTSRV && t.worktree && TESTSRV.worktree===t.worktree;
  let testbtn = "";
  if(t.worktree){
    if(!isTest){
      testbtn = `<button onclick='startTest(${JSON.stringify(t.worktree)},this)'>▶ Test this branch</button>`;
    } else if(TESTSRV.error){
      testbtn = `<span class="prog err">✗ backend crashed — ${esc(TESTSRV.error)}</span> <button class="ghost" onclick="stopTest(this)">Stop</button>`;
    } else if(TESTSRV.backend_up){
      testbtn = `<a class="applink" href="${TESTSRV.web_url}" target="_blank">▶ open app</a> <button class="ghost" onclick="stopTest(this)">Stop test</button>`;
    } else {
      // worktree claimed but the dev server hasn't bound its port yet
      testbtn = `<span class="prog"><span class="pulse"></span>starting dev server… (first boot can take a minute)</span> <button class="ghost" onclick="stopTest(this)">Stop</button>`;
    }
  }
  const reworkBtn = t.session_id ? `<button onclick="toggleRework(${t.id})">Doesn't work →</button>` : "";
  // copy the command to attach to this run's headless Claude session
  const copyBtn = t.session_id ? `<button class="ghost" title="copies: cd ${esc(REPO)} && claude --resume ${t.session_id}" onclick="copyResume('${t.session_id}',this)">⧉ session ${TASK_LABEL[t.id]||''}</button>` : "";
  let acts="";
  if(t.status==="failed"){
    const resumeBtn = t.session_id ? `<button class="primary" onclick="resumeTask(${t.id},this)">▶ Resume</button>` : "";
    const prLink = t.pr_url ? `<a class="prbtn" href="${t.pr_url}" target="_blank">partial PR ↗</a>` : "";
    acts=`${resumeBtn} ${prLink} ${reworkBtn} <button onclick="setStatus(${t.id},'queued')">Retry fresh</button> <button class="ghost" onclick="setStatus(${t.id},'rejected')">Drop</button>`;
  }
  else if(t.status==="blocked") acts=`<button class="ghost" onclick="setStatus(${t.id},'queued')">Queue anyway</button> <button class="ghost" onclick="setStatus(${t.id},'rejected')">Drop</button>`;
  else if(t.status==="done") acts=`${t.pr_url?`<a class="prbtn" href="${t.pr_url}" target="_blank">Open PR to merge ↗</a> `:""}${testbtn} ${reworkBtn} <button class="ghost" onclick="cleanupTask(${t.id})">✓ Merged — clean up</button>`;
  else if(t.status==="running"||t.status==="parked") acts=testbtn;
  // "Just delete this": abandon from ANY state — stop servers, remove the worktree,
  // force-delete the branch, drop the task. Available on every card.
  const delBtn = `<button class="ghost" onclick="deleteTask(${t.id})" title="abandon: stop servers, remove worktree, delete branch">🗑 Delete</button>`;
  acts = (acts ? acts + " " : "") + delBtn;
  // inline feedback chat for "Doesn't work →" (no popup; survives refresh while focused)
  const rwbox = REWORK_OPEN.has(t.id) ? `<div class="rwbox">
    <textarea id="rw${t.id}" rows="3" placeholder="What went wrong when you tested it? This goes back to the SAME Claude session — it fixes the same worktree + PR."></textarea>
    <div class="acts"><button class="primary" onclick="sendRework(${t.id})">Send to Claude →</button>
      <button class="ghost" onclick="toggleRework(${t.id})">Cancel</button></div>
  </div>` : "";
  // collapsed-by-default manual-test guide
  let testplan = "";
  if(t.status==="done" && t.test_plan){
    const id = "tp"+t.id;
    testplan = `<details class="testplan" ${TESTPLAN_OPEN.has(t.id)?'open':''} ontoggle="onTestPlanToggle(${t.id}, this.open)">
      <summary>🧪 How to test this
        <button class="cp" onclick="copyTestPlan(event,'${id}')">Copy</button></summary>
      <pre id="${id}">${esc(t.test_plan)}</pre>
    </details>`;
  }
  return `<div class="card s-${t.status}">
    <div class="ctitle"><span class="lab">${TASK_LABEL[t.id]||'·'}</span><span class="t">${esc(t.title)}</span>${featuretestChip(t)}</div>
    ${src?`<div class="cmeta">${src}</div>`:""}
    ${reason?`<div class="creason">${reason}</div>`:""}
    ${thumbs?`<div class="thumbs">${thumbs}</div>`:""}
    ${stopMsg}
    ${prog}
    ${(acts||copyBtn)?`<div class="acts">${acts} ${copyBtn}</div>`:""}
    ${isTest?testHealthLine():""}
    ${featuretestDetail(t)}
    ${rwbox}
    ${testplan}
  </div>`;
}

// Feature-tester verdict, shown on EVERY card: a small chip + an expandable detail
// with the per-cycle turns and the final test output. ALL outcomes
// (pass/skipped/blocked/fail), recorded by the run via /api/featuretest.
function ftParse(t){ try{ const f=JSON.parse(t.featuretest||"null");
  // normalize the verdict to the known enum so it's always safe to render raw in
  // the chip/class (a client could write an arbitrary value via /api/.../update).
  if(f && !["pass","fail","blocked","skipped"].includes(f.verdict)) f.verdict="fail";
  return f; }catch(e){ return null; } }
function featuretestChip(t){
  const f = ftParse(t); if(!f || !f.verdict) return "";
  return ` <span class="ftchip ft-${f.verdict}" title="feature test: ${f.verdict}">🧪 ${f.verdict}</span>`;
}
function featuretestDetail(t){
  const f = ftParse(t); if(!f || !f.verdict) return "";
  const turns = (f.turns||[]).map(x=>`<li><b>#${x.n??""}</b> ${esc(x.note||"")}${x.result?` → <i>${esc(x.result)}</i>`:""}</li>`).join("");
  const out = f.output ? `<pre class="ftout">${esc(f.output)}</pre>` : "";
  if(!turns && !out && !f.test && !f.cycles) return "";
  const head = `feature test: ${f.verdict}${f.cycles?` · ${f.cycles} cycle${f.cycles===1?"":"s"}`:""}${f.test?` · ${esc(f.test)}`:""}`;
  return `<details class="ftdetail">
    <summary>🧪 ${esc(head)}</summary>
    ${turns?`<ul class="ftturns">${turns}</ul>`:""}
    ${out}
  </details>`;
}
// "Just delete this" — abandon a task from any state (stop servers, remove worktree,
// force-delete branch, drop the task).
async function deleteTask(tid){
  if(!confirm("Delete this task?\n\nAbandons it: stops its dev servers, removes the git worktree, and DELETES its branch (even if unmerged). The work is discarded. This cannot be undone.")) return;
  showModal("🗑 Deleting…","▸ stopping dev servers\n▸ removing the worktree\n▸ deleting the branch\n\nworking…");
  let r; try{ r = await api(`/api/tasks/${tid}/delete`,"POST",{}); }
  catch(e){ r = {output:"error: "+e}; }
  $("#modal-title").textContent = "✓ Deleted";
  $("#modal-log").textContent = (r.output||"").trim() || "Done.";
  refresh(); loadWorktrees();
}

function questionCard(q){
  const opts=(q.options||[]).map(o=>
    `<button onclick="answer(${q.id},${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("");
  return `<div class="card q">
    <div class="row"><span class="pulse"></span><b>session ${(q.session_id||'').slice(0,8)}</b>
       ${q.task_id?`· task #${q.task_id}`:""} · ${ago(q.created_at)} ago</div>
    <div style="margin:6px 0;font-weight:600">${esc(q.question)}</div>
    ${q.context?`<div class="ctx">${esc(q.context)}</div>`:""}
    <div class="opts">${opts}</div>
    <textarea id="ta${q.id}" rows="2" placeholder="…or type a custom reply"></textarea>
    <div class="acts"><button class="primary" onclick="answer(${q.id}, $('#ta${q.id}').value)">Send reply</button>
      ${q.task_id?`<button class="ghost" onclick="deleteTask(${q.task_id})" title="don't answer — abandon: remove worktree + delete branch">🗑 Delete task</button>`:""}</div>
  </div>`;
}

function section(id, hdrId, label, items, render, empty){
  const n = items.length;
  $("#"+hdrId).innerHTML = `${label} ${n?`<span class="badge b-parked">${n}</span>`:""}`;
  $("#"+id).innerHTML = n ? items.map(render).join("") : `<div class="empty">${empty}</div>`;
  $("#"+hdrId).style.display = (n||id==="needs"||id==="running"||id==="prready") ? "" : "none";
  $("#"+id).style.display = $("#"+hdrId).style.display;
}

async function refresh(){
  if(uiBusy()) return;
  let s; try{ s=await api("/api/state"); }catch(e){ return; }
  // If the daemon is now serving a newer panel build, reload once so this
  // long-lived tab never runs stale JS (e.g. a cleanup modal that can't finish).
  if(s.ui_version){
    if(UI_VERSION===null) UI_VERSION = s.ui_version;
    else if(s.ui_version !== UI_VERSION){ location.reload(); return; }
  }
  const c=s.counts, t=s.tasks||[];
  MANAGER_SESSION = s.manager_session || null;
  if(s.repo) REPO = s.repo;
  LAST_ACTIVE = ((c.running||0)+(c.parked||0)) > 0;
  // Only rebuild the DOM when something visible actually changed. Rebuilding
  // every card every second (even when idle) was the CPU/battery hog.
  const sig = JSON.stringify([c, s.paused, s.cap, s.cooldown_left,
    (s.pending_questions||[]).map(q=>[q.id,q.status,q.answer]),
    t.map(x=>[x.id,x.status,x.progress,x.pr_url,x.web_url,x.worktree,x.stopped_reason,x.featuretest]),
    // include the live test-stack state so cards re-render when a backend
    // finishes booting / crashes (otherwise the button sticks on "Starting…").
    TESTSRV && [TESTSRV.worktree, TESTSRV.backend_up, TESTSRV.web_up, !!TESTSRV.error, !!TESTSRV.web_error],
    [...TESTPLAN_OPEN], [...REWORK_OPEN]]);
  if(sig === LAST_SIG) return;
  LAST_SIG = sig;
  // Assign stable A/B/C labels by task id; mirror onto each task's worktree path
  // so the right-hand worktree shows the same letter as its card on the left.
  // A letter is bound to a task id FOR GOOD (persisted): deleting a task never
  // renumbers the survivors, and a brand-new task takes the next unused letter.
  TASK_LABEL = {}; WT_LABEL = {};
  [...t].sort((a,b)=>a.id-b.id).forEach((x)=>{
    let idx = LABEL_IDX[x.id];
    if(idx===undefined){ idx = LABEL_NEXT++; LABEL_IDX[x.id] = idx; }
    const L = letterLabel(idx);
    TASK_LABEL[x.id] = L;
    if(x.worktree) WT_LABEL[x.worktree] = L;
  });
  saveLabels();
  PAUSED = !!s.paused;
  const cap = s.cap||1;
  $("#capctl").innerHTML = `<span class="caplbl">concurrency</span>`+
    `<button onclick="setCap(${cap-1})">−</button><b>${cap}</b><button onclick="setCap(${cap+1})">+</button>`;
  $("#pausebtn").textContent = PAUSED ? "▶ Resume (run all)" : "⏸ Pause";
  $("#pausebtn").className = PAUSED ? "primary" : "ghost";
  const cd = s.cooldown_left||0;
  let banner = "";
  if(cd>0 && !s.manual_pause){
    const m=Math.ceil(cd/60);
    banner = `<div class="banner">⏳ Rate-limit cooldown — auto-resumes in ~${m} min (${c.queued} queued). Hit ▶ Resume to override and run now.</div>`;
  } else if(PAUSED){
    banner = `<div class="banner">⏸ Paused — ${c.queued} task(s) queued and ready. Nothing dispatches until you hit Resume.</div>`;
  }
  $("#pausebanner").innerHTML = banner;
  // Clean groups: Not running (queued + stopped/failed + blocked) · In progress
  // (running + parked) · Needs you (pending questions, only when >0) · PR ready.
  const notRunning = (c.queued||0)+(c.failed||0)+(c.blocked||0);
  const needsYou = (s.pending_questions||[]).length;
  const nrTarget = c.failed ? "stopped','stoppedhdr" : (c.queued ? "queued','queuehdr" : "blocked','blockedhdr");
  $("#stats").innerHTML =
    `<span class="chip" onclick="goto('${nrTarget}')">not running <b>${notRunning}</b></span>
     <span class="chip" onclick="goto('running','runninghdr')">in progress <b>${c.running+c.parked}</b></span>
     ${needsYou?`<span class="chip" onclick="goto('needs','needshdr')">needs you <b>${needsYou}</b></span>`:""}
     <span class="chip" onclick="goto('prready','prhdr')">PR ready <b>${c.done}</b></span>`;

  // Needs your input = every pending question (agent preference calls + live-run gates)
  const pend = s.pending_questions||[];
  section("needs","needshdr","Needs your input", pend, questionCard,
    "Nothing needs you right now — the agent is investigating and executing on its own.");

  section("blocked","blockedhdr","Can't be done · needs your call",
    t.filter(x=>x.status==="blocked"), taskCard, "");
  section("stopped","stoppedhdr","Stopped — needs your attention",
    t.filter(x=>x.status==="failed"), taskCard, "");
  section("running","runninghdr","In progress",
    t.filter(x=>x.status==="running"||x.status==="parked"), taskCard,
    "No runs in flight.");
  section("prready","prhdr","PR ready — merge when you're happy",
    t.filter(x=>x.status==="done"), taskCard, "Finished PRs will collect here for your final merge.");
  section("queued","queuehdr","Queued",
    t.filter(x=>x.status==="queued"), taskCard, "");
}
let LAST_SIG = "", LAST_ACTIVE = false, pollTimer = null, wtTimer = null;
let UI_VERSION = null;  // first ui_version seen; reload the tab if it changes
function scheduleNext(){
  clearTimeout(pollTimer);
  // Fast (1s) only while a run is live; slow (4s) when idle; barely (8s) when
  // the tab is hidden. Live progress stays smooth; idle/background cost drops.
  pollTimer = setTimeout(pollLoop, document.hidden ? 8000 : (LAST_ACTIVE ? 1000 : 4000));
}
async function pollLoop(){
  if(!document.hidden){ try{ await refresh(); }catch(e){} }
  scheduleNext();
}
async function wtLoop(){
  if(!document.hidden){ try{ await loadWorktrees(); }catch(e){} }
  wtTimer = setTimeout(wtLoop, document.hidden ? 30000 : 6000);
}
// Snap back to live the instant you return to the tab.
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){ clearTimeout(pollTimer); clearTimeout(wtTimer); pollLoop(); wtLoop(); }
});
refresh(); loadWorktrees();
scheduleNext();
wtTimer = setTimeout(wtLoop, 6000);
</script>
