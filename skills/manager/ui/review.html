<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review · requirement coverage</title>
<style>
  :root{
    /* neo-brutalism: warm paper canvas, near-black ink/borders, saturated-but-
       readable accents (each doubles as solid-button bg AND as text-on-tint via
       the existing `color:X;background:X22` pattern used throughout the JS) */
    --canvas:#F3EFE4; --paper:#ffffff; --ink:#141414; --dim:#54524A; --line:#141414;
    --queued:#5B6472; --prog:#1E48E0; --test:#6B2FE0; --ready:#178A46;
    --wait:#B27B00; --block:#C1440E; --fail:#C4183C; --none:#6B7280; --ctx:#4B5563;
    --shadow:#141414; --r:8px; --rl:14px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;color:var(--ink);
    background:
      radial-gradient(circle at 1px 1px, rgba(20,20,20,.07) 1px, transparent 0) 0 0/18px 18px,
      var(--canvas);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  a{color:var(--prog);font-weight:700;text-decoration:none} a:hover{text-decoration:underline;text-decoration-thickness:2px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:600}

  header{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
    padding:10px 18px;background:var(--paper);border-bottom:3px solid var(--ink)}
  header .title{font-size:15px;font-weight:900;letter-spacing:-.01em;display:inline-block;
    background:#FFE14D;border:2.5px solid var(--ink);border-radius:6px;padding:2px 10px;
    box-shadow:3px 3px 0 var(--ink);transform:rotate(-1.5deg)}
  header .sub{color:var(--dim);font-size:12px;font-weight:700}
  header .spacer{flex:1}
  .cov{display:flex;gap:6px;flex-wrap:wrap}
  .pillc{font-size:11px;font-weight:800;border-radius:6px;padding:2px 9px;cursor:pointer;
    border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em;
    transition:transform .08s ease,box-shadow .08s ease}
  .pillc:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .pillc:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  /* flashed by clicking a coverage chip — steps to the next matching card */
  .covflash{outline:3px solid var(--prog);outline-offset:2px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;font-weight:700}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--ready);border:1.5px solid var(--ink);animation:pulse 1.4s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

  #shell{display:grid;grid-template-columns:212px 1fr;height:calc(100vh - 49px)}
  #index{background:var(--paper);border-right:3px solid var(--ink);overflow-y:auto;padding:10px 0}
  #index .ihead{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink);font-weight:900;padding:8px 14px 6px}
  .irow{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;border-left:4px solid transparent;font-weight:600}
  .irow:hover{background:#FFF3B0} .irow.on{background:#E3EBFF;border-left-color:var(--ink);font-weight:800}
  .irow .sd{width:9px;height:9px;border-radius:50%;flex:none;border:1.5px solid var(--ink)}
  .irow .it{flex:1;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  #stage{overflow-y:auto;position:relative}
  #docwrap{position:relative;margin:24px auto 140px}
  /* continuous pages — no per-page chrome, one flowing document */
  .pg{position:absolute;left:0;background:var(--paper);border:2.5px solid var(--ink);
    border-radius:6px;box-shadow:5px 5px 0 var(--ink);overflow:hidden}
  .pg img{display:block;width:100%;height:100%}
  .box{position:absolute;border:2.5px dashed var(--ink);border-radius:8px;pointer-events:auto;cursor:pointer;
    transition:box-shadow .12s,border-color .12s,background .12s}
  .box:hover,.box.hl{border-style:solid;background:rgba(30,72,224,.08);box-shadow:0 0 0 3px rgba(30,72,224,.25)}
  .box .bn{position:absolute;top:-12px;left:8px;font-size:10px;font-weight:900;color:#fff;border-radius:6px;padding:1px 7px;border:1.5px solid var(--ink)}

  /* right-margin note cards (Google-Docs style), absolutely placed beside their section */
  .note{position:absolute;background:var(--paper);border:2.5px solid var(--ink);border-left-width:7px;border-left-color:var(--none);
    border-radius:10px;box-shadow:4px 4px 0 var(--ink);padding:10px 12px;transition:box-shadow .12s,transform .12s}
  .note.hl{box-shadow:4px 4px 0 var(--prog);transform:translate(-1px,-1px)}
  .note .nh{display:flex;align-items:center;gap:7px}
  .note .bn{font-size:10px;font-weight:900;color:#fff;border-radius:6px;min-width:20px;text-align:center;padding:2px 0;border:1.5px solid var(--ink)}
  .note .nt{font-weight:700;font-size:12.5px;line-height:1.3;flex:1}
  .badge{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 8px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase}
  .note .task{margin-top:7px;padding-top:7px;border-top:2px solid var(--ink);font-size:12px}
  .note .task:first-of-type{border-top:0;margin-top:5px;padding-top:0}
  .note .tt{color:var(--ink)} .note .prog{margin-top:4px;color:#222;background:#F6F4EE;
    border:2px solid var(--ink);border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.4}
  .note .ctxn{color:var(--dim);font-size:12px;margin-top:5px}
  .note .acts{margin-top:5px;font-size:11.5px}

  .empty{max-width:740px;margin:60px auto;text-align:center;color:var(--dim);font-weight:700}
  .banner{max-width:900px;margin:24px auto;background:#FFF3B0;border:3px solid var(--ink);border-radius:var(--rl);
    padding:16px 18px;color:var(--ink);font-size:13px;line-height:1.6;box-shadow:5px 5px 0 var(--ink)}
  .banner .mono{font-size:12px;word-break:break-all}
  .cmd{margin:10px 0 0;padding:12px 14px;background:var(--ink);color:#FFE14D;border:2.5px solid var(--ink);border-radius:9px;
    font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:pre-wrap;word-break:break-all;user-select:all}
  .skel{height:300px;margin:24px auto;max-width:520px;border:3px solid var(--ink);border-radius:var(--rl);
    background:linear-gradient(90deg,#e6e2d6,#f2efe6,#e6e2d6);box-shadow:5px 5px 0 var(--ink);
    background-size:200% 100%;animation:sh 1.4s infinite}@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
  /* Notion mode: the doc rendered from blocks */
  .ndoc{max-width:840px;margin:24px auto 120px;background:var(--paper);border:3px solid var(--ink);
    border-radius:var(--rl);box-shadow:7px 7px 0 var(--ink);padding:34px 42px}
  .ntest{font-size:20px;font-weight:900;letter-spacing:-.01em;color:var(--ink);margin:28px 0 6px;border-bottom:3px solid var(--ink);padding-bottom:7px}
  .ntest:first-child{margin-top:0}
  .nfeat{font-size:14.5px;font-weight:800;color:var(--ink);margin:20px 0 6px;padding-left:9px;border-left:4px solid var(--prog)}
  .ntext{font-size:13.5px;color:#3A3934;margin:6px 0;line-height:1.6}
  .nimg{display:block;max-width:100%;border:2px solid var(--ink);border-radius:8px;margin:10px 0 2px}
  .ncap{color:var(--dim);font-size:11px;margin:0 0 12px}
  .nfind{border:2.5px solid var(--ink);border-left-width:7px;border-left-color:var(--none);border-radius:10px;
    padding:13px 15px;margin:14px 0;background:#FCFBF6;box-shadow:4px 4px 0 var(--ink);scroll-margin-top:60px}
  .nfh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .sevtag{font-size:11px;font-weight:800;border-radius:6px;padding:2px 8px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
  .nft{margin-top:8px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.55}
  /* screenshot evidence attached to a finding — shown together with it */
  .nevi{margin-top:8px;display:flex;gap:7px;align-items:flex-start;font-size:12.5px;color:#4A5462;line-height:1.5}
  .nevi .evi-ic{flex:0 0 auto;opacity:.85}
  .nevi .evi-id{font-weight:800;color:var(--ink)}
  .nevi-img{display:block;max-width:100%;border:2px solid var(--ink);border-radius:8px;margin:7px 0 2px}
  .ntask{margin-top:8px;padding-top:8px;border-top:2px solid var(--ink);font-size:12.5px}
  .nprog{margin-top:4px;color:#222;background:#F6F4EE;border:2px solid var(--ink);border-radius:7px;padding:5px 7px;font-size:11.5px;line-height:1.4}
  .nnotask{margin-top:8px;color:var(--dim);font-size:12px;font-style:italic}
  .ndoc strong{font-weight:800;color:var(--ink)}
  /* cumulative pipeline breadcrumb of task/finding states */
  .prow{display:flex;flex-wrap:wrap;align-items:center;gap:4px;margin-top:2px}
  .pstep{font-size:10.5px;font-weight:700;border:1.5px solid;border-radius:999px;padding:1px 8px;opacity:.55}
  .pstep.cur{opacity:1;font-weight:900;border-width:2.5px;box-shadow:2px 2px 0 var(--ink)}
  .parr{color:var(--none);font-size:10px;opacity:.7}
  /* collapsible finding: click the header to shrink to just the header row */
  .nfh{cursor:pointer;user-select:none}
  .chev{display:inline-block;font-size:11px;color:var(--dim);transition:transform .15s;flex:0 0 auto}
  .nfind.collapsed .chev{transform:rotate(-90deg)}
  .nfind.collapsed .nbody{display:none}
  .nfind.flash{outline:3px solid var(--prog);outline-offset:2px}
  /* Test-this-branch (boots the localhost app for a PR-ready task's worktree) */
  .tact{margin-top:9px;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
  .tspacer{flex:1 1 auto}                    /* pushes session + Remove to the right */
  /* secondary action row: same buttons, quieter and smaller than the one
     primary action above them — a clear hierarchy instead of N equal buttons */
  .tact-more{margin-top:6px}
  .tact-more .tbtn{font-size:11px;padding:3px 9px;box-shadow:2px 2px 0 var(--ink);opacity:.85}
  .tact-more .tbtn:hover{opacity:1;box-shadow:3px 3px 0 var(--ink)}
  /* chunky bordered button, hard offset shadow, presses down on click */
  .tbtn{font:inherit;font-size:12px;font-weight:800;cursor:pointer;border:2.5px solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:var(--r);padding:5px 12px;line-height:1.4;
    white-space:nowrap;box-shadow:3px 3px 0 var(--ink);
    transition:transform .08s ease,box-shadow .08s ease,background .12s ease}
  .tbtn:hover{background:#FFF6C7} .tbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .tbtn:disabled{opacity:.5;cursor:default;transform:none;box-shadow:1px 1px 0 var(--ink)}
  .tbtn.primary{background:var(--prog);color:#fff}
  .tbtn.primary:hover{background:#1B3EC4}
  .tbtn.gh{border-color:var(--ink);background:transparent;color:var(--ink);box-shadow:none;font-weight:700}
  .tbtn.gh:hover{background:rgba(20,20,20,.06)} .tbtn.gh:active{transform:none}
  .tbtn.danger{background:var(--fail);color:#fff;border-color:var(--ink)}
  .tbtn.danger:hover{background:#A31230}
  .tbtn.mono{font-family:ui-monospace,Menlo,monospace;font-size:11px}
  .applink{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;background:var(--ready);
    color:#fff;border:2.5px solid var(--ink);border-radius:var(--r);padding:5px 12px;box-shadow:3px 3px 0 var(--ink)}
  .applink:hover{text-decoration:none;background:#136E3A}
  .terr{font-size:12px;color:var(--fail);font-weight:800}
  .tstarting{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);font-weight:700}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--prog);border:1.5px solid var(--ink);display:inline-block;animation:pulse 1.4s infinite}
  /* ---- migrated panel controls ---- */
  .hbtn{font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;border:2.5px solid var(--ink);
    background:var(--paper);color:var(--ink);border-radius:var(--r);padding:6px 13px;box-shadow:3px 3px 0 var(--ink);
    white-space:nowrap;transition:transform .08s ease,box-shadow .08s ease}
  .hbtn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
  .hbtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .hbtn.primary{background:var(--ready);border-color:var(--ink);color:#fff}
  .hbtn.gh{color:var(--ink);background:transparent;box-shadow:none}
  .hbtn.gh:hover{background:rgba(20,20,20,.06);transform:none;box-shadow:none}
  .hbtn.danger{color:#fff;border-color:var(--ink);background:var(--fail)}
  .hbtn.danger:hover{background:#A31230}
  .capctl{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);font-weight:700}
  .caplbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:900}
  .capb{font:inherit;cursor:pointer;border:2.5px solid var(--ink);background:var(--paper);border-radius:7px;
    width:24px;height:24px;line-height:1;color:var(--ink);font-weight:900;box-shadow:2px 2px 0 var(--ink);
    transition:transform .08s ease,box-shadow .08s ease}
  .capb:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .capb:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
  .capctl b{min-width:16px;text-align:center;font-size:13px;color:var(--ink);font-weight:900}
  #pausebanner:empty{display:none}
  .banner{background:var(--wait);border-top:3px solid var(--ink);border-bottom:3px solid var(--ink);color:#fff;font-size:12.5px;font-weight:800;padding:9px 22px}
  /* needs-your-input questions */
  .qwrap{max-width:840px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
  .qhead{font-size:11px;font-weight:900;color:var(--wait);text-transform:uppercase;letter-spacing:.5px}
  .qcard{background:#FFF8DC;border:3px solid var(--ink);border-left-width:9px;border-left-color:var(--wait);
    border-radius:var(--rl);padding:15px 17px;box-shadow:5px 5px 0 var(--ink)}
  .qh{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);font-weight:800}
  .qq{margin:7px 0 4px;font-weight:900;font-size:14.5px;color:var(--ink)}
  .qctx{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:6px;white-space:pre-wrap}
  .qopts{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .qcard textarea,.rwbox textarea{width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:var(--r);
    padding:8px 10px;font:inherit;font-size:13px;resize:vertical;margin-top:8px;background:var(--paper)}
  .qcard textarea:focus,.rwbox textarea:focus{outline:none;box-shadow:3px 3px 0 var(--ink)}
  /* task action bar / feature-test / test-plan / modal */
  .ntask-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .ntask-h .tt{font-weight:800;color:var(--ink);font-size:13.5px}
  .nprog.err{background:#FFE3E9;border-color:var(--ink);color:#7A0E28}
  .rwbox{margin-top:8px}
  .testplan{margin-top:9px;font-size:12px}
  .testplan>summary{cursor:pointer;color:var(--ink);font-weight:800;list-style:none;text-transform:uppercase;letter-spacing:.3px;font-size:11px}
  .tpbody{position:relative;margin-top:7px}
  .testplan pre{white-space:pre-wrap;background:var(--ink);color:#FFE14D;border:2.5px solid var(--ink);border-radius:9px;
    padding:11px 13px;padding-right:66px;margin:0;font-size:11.5px;line-height:1.5}
  /* chunky floating Copy button pinned to the box's top-right corner */
  .testplan .cp{position:absolute;top:8px;right:8px;font:inherit;font-size:10.5px;font-weight:800;cursor:pointer;
    border:2px solid var(--ink);background:#FFE14D;color:var(--ink);border-radius:6px;padding:3px 10px;
    box-shadow:2px 2px 0 var(--ink);transition:transform .08s ease,box-shadow .08s ease}
  .testplan .cp:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--ink)}
  .ftchip{font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 7px;border:2px solid var(--ink);box-shadow:2px 2px 0 var(--ink);text-transform:uppercase}
  .ft-pass{color:#0B6B3A;background:#B9F6CA} .ft-fail{color:#7A1330;background:#FFD0DA}
  .ft-blocked{color:#7A3B00;background:#FFE0B2} .ft-skipped{color:var(--dim);background:#ECEAE3}
  .ftdetail{margin-top:6px;font-size:12px} .ftdetail>summary{cursor:pointer;color:var(--ink);font-weight:700}
  .ftturns{margin:6px 0;padding-left:18px;font-size:12px;color:var(--ink)}
  .ftout{white-space:pre-wrap;background:var(--ink);color:#E8F0EA;border:2px solid var(--ink);border-radius:8px;padding:9px;font-size:11px;margin-top:7px}
  .otherdoc{margin-top:16px}
  #modal{display:none;position:fixed;inset:0;background:rgba(20,20,20,.55);z-index:100;align-items:center;justify-content:center;padding:20px}
  .modal-box{background:var(--paper);border:3px solid var(--ink);border-radius:var(--rl);max-width:560px;width:100%;
    max-height:80vh;overflow:auto;box-shadow:8px 8px 0 var(--ink)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 17px;border-bottom:2.5px solid var(--ink);font-weight:800}
  #modal-log{white-space:pre-wrap;padding:14px 16px;margin:0;font-size:12px;line-height:1.5;font-family:ui-monospace,Menlo,monospace}
  /* Before → After — a plain-language product view (no code): what was
     reported broken, and the concrete outcome the build agent verified. */
  .bawrap{display:flex;flex-direction:column;gap:10px;white-space:normal;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .barow{border:2.5px solid var(--ink);border-left-width:7px;border-radius:var(--r);padding:14px 16px;box-shadow:3px 3px 0 var(--ink)}
  .barow.before{background:#FFE3E9;border-left-color:var(--fail)}
  .barow.after{background:#E3F7EA;border-left-color:var(--ready)}
  .balabel{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;color:var(--ink)}
  .batext{font-size:14px;line-height:1.55;color:var(--ink)}
  .baarrow{text-align:center;font-size:11px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.3px}
  .baimgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .baimg{height:96px;width:auto;border:2px solid var(--ink);border-radius:7px;object-fit:cover;cursor:pointer;display:block}
  .bacode{margin:0;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
    line-height:1.5;background:#0d0d0d;color:#e6e6e6;border:2px solid var(--ink);border-radius:8px;padding:10px 12px}
  /* example task-doc preview — embedded INSIDE the intake question card,
     between its context text and the reply box: small, scrollable, like
     flipping through a PDF, so the whole card still fits on screen.
     Read-only — no "use this" action, just showing what a source doc looks like. */
  .exbox{margin:10px 0 2px}
  .exbar{font-size:11px;font-weight:900;color:var(--ink);
    text-transform:uppercase;letter-spacing:.3px;margin-bottom:6px}
  .exframe{height:190px;overflow-y:auto;background:var(--paper);border:2.5px solid var(--ink);
    border-radius:var(--r);box-shadow:3px 3px 0 var(--ink);padding:14px 16px;scrollbar-width:thin;
    -webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%);
    mask-image:linear-gradient(to bottom,transparent 0,#000 10px,#000 calc(100% - 10px),transparent 100%)}
  .exframe::-webkit-scrollbar{width:7px}
  .exframe::-webkit-scrollbar-thumb{background:var(--ink);border-radius:999px}
  .exframe::-webkit-scrollbar-track{background:transparent}
  .exframe .ntest{font-size:14px;margin:14px 0 4px;border-bottom-width:2px} .exframe .ntest:first-child{margin-top:0}
  .exframe .nfeat{font-size:12px;margin:10px 0 4px;border-left-width:3px}
  .exframe .nfind{padding:8px 10px;margin:7px 0;border-width:2px;box-shadow:2px 2px 0 var(--ink)}
  .exframe .nfh{cursor:default}         /* not collapsible here — just reading */
  .exframe .nft{font-size:12px}
  .exframe .ntext{font-size:12px}
  /* /manager setup progress feed — the live ingest steps */
  .setupwrap{max-width:640px;margin:44px auto 0;padding:0 16px}
  .setupwrap.doc{margin:16px auto 0}
  .setup{background:var(--paper);border:3px solid var(--ink);border-radius:var(--rl);padding:18px 20px;box-shadow:6px 6px 0 var(--ink)}
  .setup-h{font-size:14.5px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:9px;
    margin-bottom:11px;padding-bottom:11px;border-bottom:2px solid var(--ink)}
  .setup-steps{display:flex;flex-direction:column;gap:1px}
  .stp{display:flex;align-items:center;gap:11px;padding:5px 0 5px 14px;margin-left:7px;border-left:3px solid var(--ink)}
  .stp.active{border-left-color:var(--prog)} .stp.done{border-left-color:var(--ready)} .stp.error{border-left-color:var(--fail)}
  .stp-ic{flex:0 0 auto;width:18px;height:18px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:900;color:#fff;border:1.5px solid var(--ink)}
  .stp-ic.ok{background:var(--ready)} .stp-ic.err{background:var(--fail)}
  /* active step: a solid pulsing dot — same rounded-square badge shape as ok/err,
     just animated, instead of a spinning ring (which reads as a broken circle
     in a still screenshot) */
  .stp-ic.sp{background:var(--prog);animation:pulse 1.1s ease-in-out infinite}
  .pulse-lg{width:11px;height:11px;border-radius:50%;background:var(--prog);border:2px solid var(--ink);
    display:inline-block;animation:pulse 1.1s ease-in-out infinite}
  .stp-l{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35}
  .stp.done .stp-l{color:var(--dim);font-weight:500}
  .stp-d{font-size:11.5px;color:var(--dim);margin-top:2px}

  /* ---- phone ---- */
  @media (max-width:640px){
    body{overflow-x:hidden}
    header{flex-wrap:wrap;gap:8px 10px;padding:9px 13px}
    header .cov{order:5;width:100%}
    /* drop the side index; the doc scrolls fine on a phone */
    #shell{grid-template-columns:1fr;height:calc(100vh - 86px)}
    #index{display:none}
    #stage{overflow-x:auto}                 /* let the PDF pixel-board pan if used */
    .ndoc{padding:18px 15px;margin:14px auto 90px;border-radius:10px;box-shadow:5px 5px 0 var(--ink)}
    .ntest{font-size:18px} .nfeat{font-size:14px}
    .nfind{padding:11px 12px;box-shadow:3px 3px 0 var(--ink)} a{word-break:break-word}
  }
</style>
</head>
<body>
<header>
  <span class="title">Review</span><span class="sub" id="sub">…</span>
  <span class="live"><i></i> live</span>
  <div class="spacer"></div>
  <div class="cov" id="cov"></div>
  <span id="capctl" class="capctl"></span>
  <button id="modebtn" class="hbtn gh" onclick="toggleMode(this)"></button>
  <button id="pausebtn" class="hbtn" onclick="togglePause()"></button>
  <button id="clearallbtn" class="hbtn danger" onclick="clearAll(this)" title="remove ALL tasks, questions and history from the board — git worktrees are left untouched">🗑 Clear all</button>
</header>
<div id="pausebanner"></div>
<div id="shell">
  <nav id="index"><div class="ihead">requirements</div></nav>
  <div id="stage"><div class="skel"></div></div>
</div>
<div id="modal"><div id="modal-box" class="modal-box">
  <div class="modal-head"><span id="modal-title"></span><button class="tbtn gh" onclick="closeModal()">Close</button></div>
  <pre id="modal-log"></pre>
</div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
// inline markdown: escape, then render **bold** (Notion carries "**Feature**: …")
const mdi=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
async function api(p){ return (await fetch(p)).json(); }
function uiBusy(){ if(window.getSelection&&String(window.getSelection()).length) return true;
  const a=document.activeElement; return !!(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA")); }
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// A cumulative pipeline breadcrumb for a task/finding: the states it has moved
// through, in order, with the current one lit — new states append at the end.
const LABV={"queued":"--queued","in progress":"--prog","testing":"--test","PR ready":"--ready",
  "needs you":"--wait","failed":"--fail","blocked":"--block","done":"--ready","draft":"--queued",
  "no task":"--none","context":"--ctx"};
const PIPE=["queued","in progress","testing","PR ready"];   // the happy-path order
function pipelineRow(cur){
  if(!cur || cur==="no task" || cur==="context") return "";
  let idx=PIPE.indexOf(cur), branch=null;
  if(idx===-1){                                   // off the happy path
    if(cur==="needs you"){ idx=1; branch="needs you"; }   // reached "in progress", now on you
    else if(cur==="failed"){ idx=1; branch="failed"; }
    else if(cur==="blocked"){ idx=-1; branch="blocked"; }
    else idx=0;
  }
  const steps=idx>=0?PIPE.slice(0,idx+1):[];
  const pill=(l,on)=>{const c=cssv(LABV[l]||"--none");
    return `<span class="pstep${on?' cur':''}" style="color:${c};background:${c}1f;border-color:${c}55">${l}</span>`;};
  const pills=steps.map(l=>pill(l, !branch && l===cur));
  if(branch) pills.push(pill(branch,true));
  return `<div class="prow">${pills.join('<span class="parr">→</span>')}</div>`;
}

// ---- Test-this-branch: boot ONE dev server (the configured dev_command) for a
// task's worktree, same as the main panel. TESTSRV comes from /api/state.
let TESTSRV=null;
async function apiPost(p,b){ return (await fetch(p,{method:"POST",
  headers:{"Content-Type":"application/json"},body:JSON.stringify(b||{})})).json(); }
async function startTest(path,btn){ if(btn){btn.disabled=true;btn.textContent="Starting…";}
  await apiPost("/api/testserver/start",{path}); refresh(); }
async function stopTest(btn){ if(btn) btn.disabled=true; await apiPost("/api/testserver/stop",{}); refresh(); }
// Not every task has a browsable page — many are pure backend logic the build
// agent verified with `npm test`/`node -e ...` and said so in the test guide.
// Hitting "Open app" for those just lands on a 404 (no page exists to show),
// which reads as broken even though the server and the fix are both fine.
// Whether THIS PROJECT has a browsable web frontend at all is a one-time
// project fact (asked in the intake, config `has_web_ui`) — not a per-task
// guess. Guessing per-task from test_plan wording was unreliable (many
// backend-only guides still mention "the browser" in passing) and it kept
// showing an Open-app button that just 404s for projects with no frontend.
function testBtn(t){
  if(!HASWEB || !t.worktree) return "";
  const isTest = TESTSRV && TESTSRV.worktree===t.worktree;
  if(!isTest) return `<button class="tbtn" onclick='startTest(${JSON.stringify(t.worktree)},this)'>▶ Test this branch</button>`;
  if(TESTSRV.error) return `<span class="terr">✗ dev server crashed</span> <button class="tbtn gh" onclick="stopTest(this)">Stop</button>`;
  if(TESTSRV.web_up) return `<a class="applink" href="${TESTSRV.web_url}" target="_blank" title="${esc(TESTSRV.web_url||"")}">▶ Open app</a> <button class="tbtn gh" onclick="stopTest(this)">Stop test</button>`;
  return `<span class="tstarting"><span class="pulse"></span>starting dev server… (first boot can take a minute)</span> <button class="tbtn gh" onclick="stopTest(this)">Stop</button>`;
}

// ---- Before → After: a plain-language product view of what a fix did — no
// code, no diffs. "Before" is the original reported problem (the finding's
// own text, if this task is tied to one); "After" is the concrete outcome the
// build agent verified, in its own words — the "✅ Success = ..." line from
// the manual test guide it wrote, which is already written for a human to
// read and judge, not for a developer to review.
// "Before" evidence: the full finding text (from NMAP.blocks — NOT the
// truncated NMAP.findings preview) plus any screenshots actually attached to
// it (first-hand — the original reported evidence), falling back to the
// task's own evidence images when it isn't tied to a doc finding.
// Shared thumbnail strip for evidence images — used for both before and after.
function evImgs(paths){
  const imgs=(paths||[]).filter(p=>p && /\.(png|jpe?g|gif|webp)$/i.test(p));
  if(!imgs.length) return "";
  return `<div class="baimgs">${imgs.map(p=>
    `<a href="/api/image?path=${encodeURIComponent(p)}" target="_blank" title="Click to view full size"><img class="baimg" loading="lazy" src="/api/image?path=${encodeURIComponent(p)}"></a>`).join("")}</div>`;
}
function beforeEvidence(t){
  const ids=idsOf(t.source||"");
  let text=null, imgs=[];
  if(ids.length && NMAP && NMAP.blocks){
    const b=NMAP.blocks.find(x=>x.t==="finding" && x.id===ids[0]);
    if(b){ text=b.text; imgs=(b.evidence||[]).filter(e=>e.img).map(e=>e.img); }
  }
  if(!text) text=t.description || t.title;
  if(!imgs.length && (t.evidence||[]).length){
    imgs=t.evidence.filter(p=>/\.(png|jpe?g|gif|webp)$/i.test(p));
  }
  return {text, imgs};
}
// "After" evidence: the feature-tester's REAL captured output when one was
// recorded (genuine first-hand proof — actual pass/fail counts and printed
// assertions from a real run), PLUS a real screenshot of the fixed behavior
// when the run actually captured one (task.after_evidence — set via /browse
// against the live app; never fabricated, so most tasks simply have none).
// Falls back to the test guide's own "✅ Success = ..." line (still the build
// agent's words, just not raw output) only when no captured output exists.
function afterEvidence(t){
  const imgs=(t.after_evidence||[]).filter(p=>p && /\.(png|jpe?g|gif|webp)$/i.test(p));
  const f=ftParse(t);
  if(f && f.output) return {kind:"output", text:f.output, imgs};
  const tp=t.test_plan||"";
  const m=tp.match(/✅\s*success\s*=?\s*(.+)/i);
  if(m && m[1].trim()) return {kind:"reported", text:m[1].trim(), imgs};
  const lines=tp.split("\n").map(l=>l.trim()).filter(Boolean);
  if(lines.length) return {kind:"reported", text:lines[lines.length-1], imgs};
  if(t.status==="done"||t.status==="failed") return {kind:"reported", text:`Fixed: ${t.title}`, imgs};
  return {kind:"none", text:"Still in progress — no verified outcome yet.", imgs};
}
function viewEffect(tid){
  const t=TASKS.find(x=>x.id===tid); if(!t) return;
  const before=beforeEvidence(t), after=afterEvidence(t);
  const afterLabel=after.kind==="output"?"✅ After — actual test output (first-hand)":"✅ After — reported outcome";
  const afterBody=after.kind==="output"?`<pre class="bacode">${esc(after.text)}</pre>`:`<div class="batext">${esc(after.text)}</div>`;
  $("#modal-title").textContent="Before → After";
  $("#modal-log").innerHTML=`<div class="bawrap">
    <div class="barow before"><div class="balabel">🔴 Before — the problem</div><div class="batext">${esc(before.text)}</div>${evImgs(before.imgs)}</div>
    <div class="baarrow">↓ fixed by this task ↓</div>
    <div class="barow after"><div class="balabel">${afterLabel}</div>${afterBody}${evImgs(after.imgs)}</div>
  </div>`;
  $("#modal").style.display="flex";
}

// ---- Collapsible findings: click a finding's header to shrink it to just the
// header (severity + state pipeline). Persist collapsed ids across refreshes.
const COLLAPSED=new Set();
function toggleFind(id){
  COLLAPSED.has(id) ? COLLAPSED.delete(id) : COLLAPSED.add(id);
  const el=document.getElementById("find-"+id);
  if(el) el.classList.toggle("collapsed", COLLAPSED.has(id));
}

// ============================ full task controls ==========================
// Everything the classic panel does, brought onto the review board.
let PAUSED=true, MANAGER_SESSION=null, QUESTIONS=[], CAP=1, COOLDOWN=0, PUSHMODE="pr";
// Whether the project has a browsable web frontend — a one-time project fact
// (config has_web_ui), not guessed per task. null = not asked yet.
let HASWEB=null;
// Toggle where finished work lands: "pr" (push + GitHub PR, needs gh) vs
// "local" (committed local branch only — nothing leaves the machine). Applies
// to the NEXT dispatched run; in-flight runs keep the mode they started with.
async function toggleMode(btn){
  if(btn) btn.disabled=true;
  const next=PUSHMODE==="local"?"pr":"local";
  try{ await apiPost("/api/config",{push_mode:next}); }catch(e){}
  if(btn) btn.disabled=false;
  refresh();
}
// REPO + SKILLDIR come from /api/state (the configured target repo and the
// manager skill's install dir) — used in copy-to-terminal commands.
let REPO="<your repo>", SKILLDIR="~/.claude/skills/manager", BASEBR="main";
let PROGRESS={steps:[],active:false,done:false};
const REWORK_OPEN=new Set(), TESTPLAN_OPEN=new Set();
// Live setup feed shown while a /manager run ingests a source (fetch → parse →
// download → register → triage → dispatch). A clean vertical stepper.
function setupCard(){
  const steps=PROGRESS.steps||[]; if(!steps.length) return "";
  const rows=steps.map(s=>{
    const ic = s.status==="done" ? `<span class="stp-ic ok">✓</span>`
      : s.status==="error" ? `<span class="stp-ic err">✕</span>`
      : `<span class="stp-ic sp"></span>`;
    return `<div class="stp ${s.status}">${ic}<div class="stp-t"><div class="stp-l">${esc(s.label)}</div>${s.detail?`<div class="stp-d">${esc(s.detail)}</div>`:""}</div></div>`;
  }).join("");
  const head = PROGRESS.done ? "✓ Board ready" : "Setting up your board…";
  return `<div class="setup"><div class="setup-h">${PROGRESS.done?"":`<span class="pulse-lg"></span>`}${head}</div><div class="setup-steps">${rows}</div></div>`;
}
function progSig(){ return JSON.stringify((PROGRESS.steps||[]).map(s=>[s.label,s.status,s.detail])); }
function renderControls(s){
  // Pause/PR-Local/Clear-all are meaningless before a repo is configured
  // (renderSetup hides them); make sure they're back once there's a real board.
  $("#modebtn").style.display=$("#pausebtn").style.display=$("#clearallbtn").style.display="";
  const cap=s.cap||1;
  $("#capctl").innerHTML=`<span class="caplbl">concurrency</span>`+
    `<button class="capb" onclick="setCap(${cap-1})">−</button><b>${cap}</b><button class="capb" onclick="setCap(${cap+1})">+</button>`;
  const mb=$("#modebtn");
  if(mb){ mb.textContent=PUSHMODE==="local"?"💻 Local mode":"⇧ PR mode";
    mb.title=PUSHMODE==="local"
      ?"Finished work stays as LOCAL branches — no push, no PRs, no gh needed. Click to switch to PR mode."
      :"Finished work is pushed and opened as GitHub PRs (needs gh). Click to switch to local-only mode (nothing leaves this machine)."; }
  const pb=$("#pausebtn"); pb.textContent=PAUSED?"▶ Resume":"⏸ Pause"; pb.className="hbtn"+(PAUSED?" primary":" gh");
  // Only surface the time-sensitive rate-limit cooldown; the plain "Paused"
  // state is already shown by the Resume button, so no banner for it.
  const q=(s.counts&&s.counts.queued)||0; let banner="";
  if(COOLDOWN>0 && !s.manual_pause){ banner=`<div class="banner">⏳ Rate-limit cooldown — auto-resumes in ~${Math.ceil(COOLDOWN/60)} min (${q} queued). Hit ▶ Resume to override.</div>`; }
  $("#pausebanner").innerHTML=banner;
}
function ago(t){ // accepts epoch seconds (what the API sends) or an ISO string
  let ms; if(typeof t==="number") ms=t*1000;
  else if(!isNaN(+t)) ms=(+t)*1000;
  else ms=Date.parse(t);
  if(isNaN(ms)) return "";
  const s=Math.max(0,(Date.now()-ms)/1000);
  if(s<60) return "just now"; if(s<3600) return Math.round(s/60)+"m ago";
  if(s<86400) return Math.round(s/3600)+"h ago"; return Math.round(s/86400)+"d ago"; }
function showModal(t,x){ $("#modal-title").textContent=t; $("#modal-log").textContent=x; $("#modal").style.display="flex"; }
function closeModal(){ $("#modal").style.display="none"; }

// Coverage chips ("11 PR ready") are click-to-cycle: each click steps to the
// NEXT matching card and flashes it, wrapping back to the first after the
// last — so "11 PR ready" is actually browsable one at a time, not just a
// count. Works across all three board modes (doc view, plain task list, PDF
// view) since each tags its cards with the same data-covlabel attribute.
let COV_CYCLE={};
function cycleCov(label){
  const els=[...document.querySelectorAll(`[data-covlabel="${CSS.escape(label)}"]`)];
  if(!els.length) return;
  const i=(COV_CYCLE[label]||0)%els.length;
  const el=els[i];
  const stage=$("#stage");
  stage.scrollTo({top:Math.max(0, el.offsetTop-60), behavior:"smooth"});
  el.classList.add("covflash"); setTimeout(()=>el.classList.remove("covflash"),1300);
  COV_CYCLE[label]=i+1;
}

async function answer(qid,text){ if(!text)return; await apiPost(`/api/questions/${qid}/answer`,{answer:text}); refresh(); }
async function setStatus(tid,status){ await apiPost(`/api/tasks/${tid}/status`,{status}); refresh(); }
async function togglePause(){ await apiPost(PAUSED?"/api/resume":"/api/pause",{}); refresh(); }
async function setCap(n){ if(n<1)return; await apiPost("/api/cap",{cap:n}); refresh(); }
async function clearAll(btn){
  if(!confirm("Remove ALL tasks, questions and history from the board?\n\nGit worktrees are left untouched — remove those with each task's Delete button. This can't be undone."))return;
  const label=btn?btn.textContent:""; if(btn){btn.disabled=true;btn.textContent="Clearing…";}
  try{ await apiPost("/api/reset",{}); }catch(e){ alert("Could not clear the board: "+e); }
  finally{ if(btn){btn.disabled=false;btn.textContent=label;} refresh(); }
}
function toggleRework(tid){ REWORK_OPEN.has(tid)?REWORK_OPEN.delete(tid):REWORK_OPEN.add(tid); renderNotion(); }
async function sendRework(tid){ const v=($("#rw"+tid)?.value||"").trim(); if(!v)return;
  REWORK_OPEN.delete(tid); await apiPost(`/api/tasks/${tid}/rework`,{feedback:v}); refresh(); }
async function resumeTask(tid,btn){ if(btn){btn.disabled=true;btn.textContent="Resuming…";}
  await apiPost(`/api/tasks/${tid}/resume`,{}); refresh(); }
async function cleanupTask(tid){
  if(!confirm("All done with this one?\n\nRemoves its git worktree and deletes the branch (only if merged), then clears the task.\n\nMake sure you've MERGED the PR first.")) return;
  showModal("🧹 Cleaning up…","▸ stopping dev servers\n▸ removing the worktree\n▸ pruning + de-registering\n▸ deleting the branch (only if merged)\n\nworking…");
  let r; try{ r=await apiPost(`/api/tasks/${tid}/cleanup`,{}); }catch(e){ r={output:"error: "+e}; }
  $("#modal-title").textContent="✓ Cleanup complete"; $("#modal-log").textContent=(r.output||"").trim()||"Done."; refresh();
}
async function deleteTask(tid){
  if(!confirm("Delete this task?\n\nAbandons it: stops dev servers, removes the git worktree, and DELETES its branch (even if unmerged). The work is discarded. Cannot be undone.")) return;
  showModal("🗑 Deleting…","▸ stopping dev servers\n▸ removing the worktree\n▸ deleting the branch\n\nworking…");
  let r; try{ r=await apiPost(`/api/tasks/${tid}/delete`,{}); }catch(e){ r={output:"error: "+e}; }
  $("#modal-title").textContent="✓ Deleted"; $("#modal-log").textContent=(r.output||"").trim()||"Done."; refresh();
}
function copyResume(sid,btn){ navigator.clipboard.writeText(`cd ${REPO} && claude --resume ${sid}`)
  .then(()=>{ if(btn){const o=btn.textContent;btn.textContent="copied ✓";setTimeout(()=>btn.textContent=o,1200);} }); }
function copyBranchReview(branch,btn){
  navigator.clipboard.writeText(`cd ${REPO} && git diff ${BASEBR}...${branch}   # review; merge when happy: git merge --squash ${branch} && git commit`)
  .then(()=>{ if(btn){const o=btn.textContent;btn.textContent="copied ✓";setTimeout(()=>btn.textContent=o,1400);} }); }
function copyTestPlan(ev,id){ ev.preventDefault(); ev.stopPropagation();
  const txt=document.getElementById(id)?.textContent||"";
  navigator.clipboard.writeText(txt).then(()=>{const b=ev.target;const o=b.textContent;b.textContent="Copied ✓";setTimeout(()=>b.textContent=o,1200);}); }
function onTestPlanToggle(id,open){ open?TESTPLAN_OPEN.add(id):TESTPLAN_OPEN.delete(id); }
// ---- Setup mode: the daemon started without a valid target repo. Show a
// friendly setup screen; saving POSTs /api/config, the daemon restarts itself,
// and the normal poll loop picks the board back up automatically.
function renderSetup(s){
  PROGRESS=s.progress||{steps:[],active:false,done:false};   // live feed works in setup mode too
  // Nothing to pause, no push mode, nothing to clear yet — hide, don't show blank pills.
  $("#modebtn").style.display=$("#pausebtn").style.display=$("#clearallbtn").style.display="none";
  const sig="setup:"+(s.repo||"")+":"+(s.config_path||"")+":"+progSig();
  if(sig===LAST_SIG) return; LAST_SIG=sig;
  $("#sub").textContent="setup";
  // Claude's live status (progress beacons) renders ABOVE the repo form, so the
  // user sees what's happening from the very first second — even with no repo.
  const live=(PROGRESS.steps||[]).length?`<div style="margin-bottom:12px">${setupCard()}</div>`:"";
  $("#stage").innerHTML=`<div class="setupwrap">${live}<div class="setup">
    <div class="setup-h">👋 One thing before we start — which repo should the manager work on?</div>
    <p class="ntext">Paste an absolute path — an existing git repo, or a plain folder and one
    will be created there for you (local by default). Or just answer the question in your
    Claude session instead.</p>
    <input id="repoIn" value="${esc(s.repo||"")}" placeholder="/absolute/path/to/your/repo"
      onkeydown="if(event.key==='Enter'){event.preventDefault();$('#repoSave').click();}"
      style="width:100%;box-sizing:border-box;border:2.5px solid var(--ink);border-radius:8px;padding:9px 11px;font:inherit;font-size:13px;margin:8px 0">
    <div class="tact"><button id="repoSave" class="tbtn primary" onclick="saveRepo(this)">Use this repo →</button>
      <span id="setupmsg" class="ntext"></span></div>
    <p class="ntext" style="color:var(--dim);margin-top:10px">Saved to <span class="mono">${esc(s.config_path||"config.json")}</span> —
    the daemon restarts itself and this page becomes the live board.</p>
    <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:10px">
      <div style="font-size:11px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px">What happens once a repo is set</div>
      <ol class="ntext" style="margin:0;padding-left:20px;color:var(--dim)">
        <li>Claude ingests your work source (QA doc, Notion page, or task list)</li>
        <li>Each item is grounded in the repo and deduped against already-shipped work</li>
        <li>Survivors are triaged and dispatched to parallel builder agents</li>
        <li>Finished work collects here as PR-ready branches — <b>you</b> test + merge</li>
      </ol>
    </div>
  </div></div>`;
}
async function saveRepo(btn){
  const v=($("#repoIn")?.value||"").trim(); if(!v){ $("#setupmsg").textContent="enter a path first"; return; }
  btn.disabled=true; btn.textContent="Saving…";
  let r; try{ r=await apiPost("/api/config",{repo:v}); }catch(e){ r={ok:false,error:String(e)}; }
  if(r&&r.ok){ $("#setupmsg").textContent="✓ Saved — restarting the daemon…"; LAST_SIG=""; }
  else{ $("#setupmsg").textContent="✗ "+((r&&r.error)||"could not save");
    btn.disabled=false; btn.textContent="Use this repo →"; }
}

// feature-test verdict (recorded by the run) — chip + expandable detail
function ftParse(t){ try{ const f=JSON.parse(t.featuretest||"null");
  if(f && !["pass","fail","blocked","skipped"].includes(f.verdict)) f.verdict="fail"; return f; }catch(e){ return null; } }
function featuretestChip(t){ const f=ftParse(t); if(!f||!f.verdict) return "";
  return ` <span class="ftchip ft-${f.verdict}">🧪 ${f.verdict}</span>`; }
function featuretestDetail(t){ const f=ftParse(t); if(!f||!f.verdict) return "";
  const turns=(f.turns||[]).map(x=>`<li><b>#${x.n??""}</b> ${esc(x.note||"")}${x.result?` → <i>${esc(x.result)}</i>`:""}</li>`).join("");
  const out=f.output?`<pre class="ftout">${esc(f.output)}</pre>`:"";
  if(!turns&&!out&&!f.test&&!f.cycles) return "";
  const head=`feature test: ${f.verdict}${f.cycles?` · ${f.cycles} cycle${f.cycles===1?"":"s"}`:""}${f.test?` · ${esc(f.test)}`:""}`;
  return `<details class="ftdetail"><summary>🧪 ${esc(head)}</summary>${turns?`<ul class="ftturns">${turns}</ul>`:""}${out}</details>`; }

// The task's action bar. One primary action per state; secondary actions stay
// quiet; the session chip + a single "Remove" sit to the right.
// ONE bold primary action per card (the thing you actually came to do); every
// other control — see-the-effect, rework, session resume, remove — sits in a
// quieter secondary row beneath it, smaller and visually de-emphasized. Same
// buttons, same behavior, just a clear hierarchy instead of 6+ equal-weight
// buttons crammed into one row.
function taskActions(t){
  const tb=testBtn(t);
  // Mutually exclusive with the live-app button: a project either has a page
  // to open (tb) or it doesn't — never show both, never show neither.
  const viewBtn=(!HASWEB && (t.worktree||t.pr_url))?`<button class="tbtn gh" onclick="viewEffect(${t.id})">👀 See the effect</button>`:"";
  const reworkBtn=(t.session_id && (t.status==="done"||t.status==="failed"))
    ?`<button class="tbtn gh" onclick="toggleRework(${t.id})">Doesn't work →</button>`:"";
  const sess=t.session_id?`<button class="tbtn gh mono" title="copy: cd ${esc(REPO)} && claude --resume ${t.session_id}" onclick="copyResume('${t.session_id}',this)">⧉ ${esc(t.session_id.slice(0,4))}</button>`:"";
  // ONE removal control on every task: full teardown — stops servers, removes
  // the worktree, deletes the branch, drops the task. "Delete everything here."
  const remove=`<button class="tbtn danger" onclick="removeTask(${t.id})" title="stop servers, remove the worktree, delete the branch, and clear this task">🗑 Remove</button>`;
  let main="";
  if(t.status==="failed"){
    const resumeBtn=t.session_id?`<button class="tbtn primary" onclick="resumeTask(${t.id},this)">▶ Resume</button>`:"";
    const prLink=t.pr_url?`<a class="tbtn gh" href="${esc(t.pr_url)}" target="_blank">partial PR ↗</a>`:"";
    main=`${resumeBtn} ${prLink} <button class="tbtn gh" onclick="setStatus(${t.id},'queued')">Retry fresh</button>`;
  } else if(t.status==="blocked"){
    main=`<button class="tbtn primary" onclick="setStatus(${t.id},'queued')">Queue anyway</button>`;
  } else if(t.status==="done"){
    // PR mode: link to the PR. Local mode (no pr_url): show the local branch
    // with a copyable review command — the work never left the machine.
    const finished = t.pr_url
      ? `<a class="tbtn primary" href="${esc(t.pr_url)}" target="_blank">Open PR to merge ↗</a>`
      : (t.branch ? `<button class="tbtn primary mono" title="copy: git -C ${esc(REPO)} diff ${esc(t.branch)} — review, then merge locally with git merge --squash ${esc(t.branch)}" onclick="copyBranchReview(${JSON.stringify(t.branch)},this)">⎇ ${esc(t.branch)} · copy review cmd</button>` : "");
    main=`${finished} ${tb}`;
  } else if(t.status==="running"||t.status==="parked"){ main=tb; }
  const primaryRow=main.trim()?`<div class="tact">${main}</div>`:"";
  const more=[viewBtn,reworkBtn].filter(Boolean).join(" ");
  return `${primaryRow}<div class="tact tact-more">${more}<span class="tspacer"></span>${sess}${remove}</div>`;
}
// One consolidated removal (replaces the old "clean up" + "delete" pair).
async function removeTask(tid){
  if(!confirm("Remove this task?\n\nStops its dev servers, removes the git worktree, deletes its branch, and clears it from the board.\n\nMerge the PR on GitHub first if you want to keep it — the remote PR is unaffected. This can't be undone."))return;
  showModal("🗑 Removing…","▸ stopping dev servers\n▸ removing the worktree\n▸ deleting the branch\n\nworking…");
  let r; try{ r=await apiPost(`/api/tasks/${tid}/delete`,{}); }catch(e){ r={output:"error: "+e}; }
  $("#modal-title").textContent="✓ Removed"; $("#modal-log").textContent=(r.output||"").trim()||"Done."; refresh();
}

// A task row. Under a finding (`bare`) it's just progress + actions — the
// finding header already carries the title's context and the state pipeline,
// so the row doesn't repeat the tool's task title / verdict / pipeline. In the
// standalone "Other tasks" list (no finding above it) it shows title + pipeline.
function taskRow(t, bare){
  const prog=(t.status==="running"||t.status==="parked")&&t.progress?`<div class="nprog"><span class="pulse"></span>${esc(t.progress)}</div>`:"";
  const stopMsg=(t.status==="failed"&&t.stopped_reason)?`<div class="nprog err">⚠ ${esc(t.stopped_reason)}</div>`:"";
  const rw=REWORK_OPEN.has(t.id)?`<div class="rwbox"><textarea id="rw${t.id}" rows="3" placeholder="What went wrong when you tested it? This goes to the SAME Claude session — it fixes the same worktree + PR."></textarea><div class="tact"><button class="tbtn primary" onclick="sendRework(${t.id})">Send to Claude →</button> <button class="tbtn gh" onclick="toggleRework(${t.id})">Cancel</button></div></div>`:"";
  let testplan="";
  if(t.status==="done"&&t.test_plan){ const id="tp"+t.id;
    testplan=`<details class="testplan" ${TESTPLAN_OPEN.has(t.id)?'open':''} ontoggle="onTestPlanToggle(${t.id},this.open)"><summary>🧪 Test steps</summary><div class="tpbody"><button class="cp" onclick="copyTestPlan(event,'${id}')">Copy</button><pre id="${id}">${esc(t.test_plan)}</pre></div></details>`;
  }
  const head = bare ? "" : `<div class="ntask-h"><span class="tt">${esc(t.title)}</span></div>${pipelineRow(taskState(t).l)}`;
  return `<div class="ntask">${head}${prog}${stopMsg}${taskActions(t)}${rw}${testplan}</div>`;
}

function questionCard(q){
  const opts=(q.options||[]).map(o=>`<button class="tbtn" onclick="answer(${q.id},${JSON.stringify(o).replace(/"/g,'&quot;')})">${esc(o)}</button>`).join("");
  // Meta line stays minimal: internal session ids (manager-intake, agent-task-N)
  // are noise — only a real dispatched run's id is worth showing.
  const sid=q.session_id||"";
  const run=(sid && !sid.startsWith("manager") && !sid.startsWith("agent-task"))?` · run ${esc(sid.slice(0,8))}`:"";
  const when=ago(q.created_at);
  // The intake question shows the demo doc INLINE, right between the context
  // text and the reply box — a small scrollable, read-only preview so a new
  // user can see what a source doc looks like without leaving this one card.
  const example=sid==="manager-intake"?exampleInline():"";
  return `<div class="qcard">
    <div class="qh"><span class="pulse"></span>${q.task_id?`task #${q.task_id}`:"Claude asks"}${run}${when?` · ${when}`:""}</div>
    <div class="qq">${esc(q.question)}</div>
    ${q.context?`<div class="qctx">${esc(q.context)}</div>`:""}
    ${example}
    ${opts?`<div class="qopts">${opts}</div>`:""}
    <textarea id="ta${q.id}" rows="2" placeholder="…or type a custom reply"></textarea>

  </div>`;
}

const PAGEW=520, GAP=10, NOTESW=330, COLGAP=26;
const STATE={ queued:{l:"queued",v:"--queued"}, running:{l:"in progress",v:"--prog"},
  parked:{l:"needs you",v:"--wait"}, done:{l:"PR ready",v:"--ready"}, failed:{l:"failed",v:"--fail"},
  blocked:{l:"blocked",v:"--block"}, needs_input:{l:"needs you",v:"--wait"}, draft:{l:"draft",v:"--queued"} };
function taskState(t){
  if(t.status==="running" && /test|vitest|feature[- ]?test|verify/i.test(t.progress||"")) return {l:"testing",v:"--test"};
  return STATE[t.status]||{l:t.status,v:"--queued"};
}
function pagesOf(src){ const m=(src||"").match(/\bpp?\.?\s*([\d][\d,\s–-]*)/i); if(!m) return [];
  const out=[]; for(const part of m[1].split(",")){ const r=part.trim().match(/^(\d+)\s*[–-]\s*(\d+)$/);
    if(r){ for(let i=+r[1]; i<=+r[2]&&i<=+r[1]+20; i++) out.push(i); } else if(/^\d+$/.test(part.trim())) out.push(+part.trim()); }
  return [...new Set(out)]; }

let TASKS=[], PDF=null, MAP=null, UIV=null, BUILT="", LAST_SIG="", LAST_ACTIVE=false, timer=null;
function pdfPage(n){ return "/api/pdf-page?path="+encodeURIComponent(PDF)+"&page="+n; }

// section state: roll up its tasks; flag findings with no task; context stays neutral
function secState(sec){
  const ts=sec._tasks||[];
  if(ts.length){
    const has=k=>ts.some(t=>t.status===k);
    if(has("failed")) return {l:"failed",v:"--fail"};
    if(has("blocked")) return {l:"blocked",v:"--block"};
    if(has("parked")||has("needs_input")) return {l:"needs you",v:"--wait"};
    const run=ts.find(t=>t.status==="running"); if(run) return taskState(run);
    if(has("queued")) return {l:"queued",v:"--queued"};
    if(ts.every(t=>t.status==="done")) return {l:"PR ready",v:"--ready"};
    return taskState(ts[0]);
  }
  if(sec.kind==="context") return {l:"context",v:"--ctx"};
  // While the batch is still being triaged, an un-tasked section is provisional,
  // not final — show it as "in progress" rather than the (misleading) "no task".
  return PROGRESS.active ? {l:"in progress",v:"--prog"} : {l:"no task",v:"--none"};
}

function pageTops(){ // cumulative top + display height per page
  const tops={}, hs={}; let y=0;
  for(const p of MAP.pages){ const dh=Math.round(PAGEW*p.h/p.w); tops[p.n]=y; hs[p.n]=dh; y+=dh+GAP; }
  return {tops,hs,total:y};
}

function buildStage(){
  const stage=$("#stage");
  if(!PDF){ stage.innerHTML=`<div class="empty">No source PDF registered for this batch.</div>`; BUILT="none"; return; }
  if(!MAP || !MAP.pages.length){
    const cmd=`mkdir -p "${SKILLDIR}/.pdfs" && cp "${PDF}" "${SKILLDIR}/.pdfs/source.pdf" && curl -s -X POST ${location.origin}/api/source-pdf -H 'Content-Type: application/json' -d '{"path":"${SKILLDIR}/.pdfs/source.pdf"}'`;
    stage.innerHTML=`<div class="banner"><b>Can't read the PDF.</b> It's in a permission-protected folder (<span class="mono">${esc(PDF)}</span>). Run once in your terminal, then it appears automatically:<pre class="cmd">${esc(cmd)}</pre></div>`;
    BUILT="nomap"; return;
  }
  const {tops,hs,total}=pageTops();
  let pg="";
  for(const p of MAP.pages) pg+=`<div class="pg" id="pg-${p.n}" style="top:${tops[p.n]}px;width:${PAGEW}px;height:${hs[p.n]}px"><img loading="lazy" src="${esc(pdfPage(p.n))}"></div>`;
  stage.innerHTML=`<div id="docwrap" style="width:${PAGEW+COLGAP+NOTESW}px;height:${total}px">
    <div id="pages">${pg}</div>
    <div id="notes" style="position:absolute;left:${PAGEW+COLGAP}px;top:0;width:${NOTESW}px"></div></div>`;
  BUILT=PDF+"|"+MAP.pages.length;
}

function renderAll(){
  if(!MAP) return;
  // assign tasks to sections by page-containment (section span = its page → next section's page-1)
  const secs=MAP.sections.map((s,i)=>({...s,_i:i,_tasks:[]}));
  const spans=secs.map((s,i)=>({lo:s.page, hi:(i+1<secs.length?secs[i+1].page-1:1e9)}));
  const live=TASKS.filter(t=>t.status!=="rejected");
  for(const t of live){ const pg=pagesOf(t.source)[0]||1;
    let si=spans.findIndex(sp=>pg>=sp.lo&&pg<=sp.hi); if(si<0) si=secs.length-1;
    if(secs[si]) secs[si]._tasks.push(t); }

  // header coverage
  const cnt={}; for(const s of secs){ const l=secState(s).l; cnt[l]=(cnt[l]||0)+1; }
  $("#sub").textContent=(PDF?PDF.split("/").pop()+" · ":"")+secs.length+" sections";
  const order=["PR ready","in progress","testing","needs you","blocked","failed","no task","queued","context"];
  const colv={"PR ready":"--ready","in progress":"--prog","testing":"--test","needs you":"--wait","blocked":"--block","failed":"--fail","no task":"--none","queued":"--queued","context":"--ctx"};
  $("#cov").innerHTML=order.filter(l=>cnt[l]).map(l=>{const c=cssv(colv[l]);return `<span class="pillc" onclick="cycleCov('${l}')" title="click to step through each ${esc(l)} item" style="color:${c};background:${c}22">${cnt[l]} ${l}</span>`;}).join("");

  // section index
  $("#index").innerHTML=`<div class="ihead">requirements · ${secs.length}</div>`+secs.map(s=>{
    const c=cssv(secState(s).v);
    return `<div class="irow" data-i="${s._i}"><span class="sd" style="background:${c}"></span><span class="it" title="${esc(s.title)}">${s._i+1}. ${esc(s.title)}</span></div>`;
  }).join("");

  if(BUILT==="none"||BUILT==="nomap"||!$("#docwrap")) return;
  const {tops,hs}=pageTops();
  // boxes overlaid on the pages
  document.querySelectorAll(".box").forEach(b=>b.remove());
  for(const s of secs){ const c=cssv(secState(s).v);
    for(const b of s.boxes){ const pg=document.getElementById("pg-"+b.page); if(!pg)continue;
      const d=document.createElement("div"); d.className="box bx-"+s._i; d.dataset.i=s._i;
      d.style.cssText=`left:${b.x*100}%;top:${b.y*100}%;width:${b.w*100}%;height:${b.h*100}%;border-color:${c}`;
      if(b===s.boxes[0]) d.innerHTML=`<span class="bn" style="background:${c}">${s._i+1}</span>`;
      pg.appendChild(d); }
  }
  // margin note cards, then collision-avoid downward
  const notes=$("#notes"); notes.innerHTML="";
  const placed=[];
  for(const s of secs){ const st=secState(s), c=cssv(st.v);
    const want=(tops[s.page]||0)+((s.boxes[0]?s.boxes[0].y:0)*(hs[s.page]||0));
    const tasksHtml = s._tasks.length ? s._tasks.map(t=>{const ts=taskState(t),tc=cssv(ts.v);
      const prog=(t.status==="running"||t.status==="parked")&&t.progress?`<div class="prog">${esc(t.progress)}</div>`:"";
      const pr=/^https?:\/\//i.test(t.pr_url||"")?`<div class="acts"><a href="${esc(t.pr_url)}" target="_blank">${t.status==="failed"?"partial PR ↗":"PR ↗"}</a></div>`:"";
      return `<div class="task"><span class="badge" style="color:${tc};background:${tc}22">${ts.l}</span> <span class="tt">${esc(t.title)}</span>${prog}${pr}</div>`;}).join("")
      : `<div class="ctxn">${s.kind==="context"?"Reference / setup — not a task.":"No task recorded for this section yet."}</div>`;
    const el=document.createElement("div"); el.className="note nt-"+s._i; el.dataset.i=s._i;
    el.dataset.covlabel=st.l;
    el.style.left="0px"; el.style.width=NOTESW+"px"; el.style.borderLeftColor=c;
    el.innerHTML=`<div class="nh"><span class="bn" style="background:${c}">${s._i+1}</span><span class="nt">${esc(s.title)}</span>
        <span class="badge" style="color:${c};background:${c}22">${st.l}</span></div>${tasksHtml}`;
    notes.appendChild(el);
    placed.push({el,want});
  }
  // place with no overlap
  placed.sort((a,b)=>a.want-b.want); let cursor=0;
  for(const p of placed){ const top=Math.max(p.want,cursor); p.el.style.top=top+"px"; cursor=top+p.el.offsetHeight+10; }
  wireHover();
}

function wireHover(){
  const link=(i,on)=>{ document.querySelectorAll(".bx-"+i+",.nt-"+i).forEach(e=>e.classList.toggle("hl",on)); };
  document.querySelectorAll(".note,.box").forEach(e=>{ const i=e.dataset.i;
    e.onmouseenter=()=>link(i,true); e.onmouseleave=()=>link(i,false); });
  document.querySelectorAll(".irow").forEach(r=>{ const i=r.dataset.i;
    r.onmouseenter=()=>link(i,true); r.onmouseleave=()=>link(i,false);
    r.onclick=()=>{ const n=document.querySelector(".nt-"+i); if(n){ const stage=$("#stage");
      stage.scrollTo({top: Math.max(0, parseFloat(n.style.top)-24), behavior:"smooth"}); }
      document.querySelectorAll(".irow").forEach(x=>x.classList.toggle("on",x===r)); }; });
}

// ---------- Notion mode: render the doc-map (blocks) with per-finding status ----------
let NMAP=null;
function idOf(s){ const m=(s||"").match(/\b(\d+\.\d+(?:\.\d+){0,2})\b/); return m?m[1]:null; }
// ALL finding ids named in a task's source — a task like "feature 2.1.1 + bug 2.1.2"
// covers both findings, so it must surface under each (not just the first id).
function idsOf(s){ return (s||"").match(/\b\d+\.\d+(?:\.\d+){0,2}\b/g) || []; }
function findTasks(id){ return TASKS.filter(t=>t.status!=="rejected" && idsOf(t.source).includes(id)); }
function findState(f){
  const ts=findTasks(f.id);
  // While the batch is still being triaged, an un-tasked finding is provisional,
  // not final — show it as "in progress" rather than the (misleading) "no task".
  if(!ts.length) return PROGRESS.active ? {l:"in progress",v:"--prog"} : {l:"no task",v:"--none"};
  const has=k=>ts.some(t=>t.status===k);
  if(has("failed")) return {l:"failed",v:"--fail"};
  if(has("blocked")) return {l:"blocked",v:"--block"};
  if(has("parked")||has("needs_input")) return {l:"needs you",v:"--wait"};
  const r=ts.find(t=>t.status==="running"); if(r) return taskState(r);
  if(has("queued")) return {l:"queued",v:"--queued"};
  if(ts.every(t=>t.status==="done")) return {l:"PR ready",v:"--ready"};
  return taskState(ts[0]);
}
async function refreshNotion(){
  if(!NMAP){ try{ NMAP=await api("/api/notion-map"); }catch(e){} }
  const tsSig = TESTSRV ? [TESTSRV.worktree,TESTSRV.backend_up,TESTSRV.web_up,!!TESTSRV.error] : null;
  const sig=JSON.stringify(["n", NMAP&&(NMAP.findings||[]).length, tsSig, PAUSED, CAP, COOLDOWN>0, progSig(), HASWEB,
    QUESTIONS.map(q=>[q.id,q.status,q.answer]), [...REWORK_OPEN], [...TESTPLAN_OPEN],
    TASKS.map(t=>[t.id,t.status,t.progress,t.pr_url,t.source,t.worktree,t.stopped_reason,t.featuretest,t.session_id])]);
  if(sig!==LAST_SIG){ LAST_SIG=sig; renderNotion(); }
}
function renderNotion(){
  const stage=$("#stage");
  if(!NMAP || !NMAP.blocks){ stage.innerHTML=`<div class="empty">Loading the Notion doc…</div>`; return; }
  const finds=NMAP.findings||[];
  const cnt={}; finds.forEach(f=>{const l=findState(f).l; cnt[l]=(cnt[l]||0)+1;});
  $("#sub").textContent=(NMAP.title||"Notion")+" · "+finds.length+" findings";
  const order=["PR ready","in progress","testing","needs you","blocked","failed","no task","queued"];
  const colv={"PR ready":"--ready","in progress":"--prog","testing":"--test","needs you":"--wait","blocked":"--block","failed":"--fail","no task":"--none","queued":"--queued"};
  $("#cov").innerHTML=order.filter(l=>cnt[l]).map(l=>{const c=cssv(colv[l]);return `<span class="pillc" onclick="cycleCov('${l}')" title="click to step through each ${esc(l)} item" style="color:${c};background:${c}22">${cnt[l]} ${l}</span>`;}).join("");
  $("#index").innerHTML=`<div class="ihead">findings · ${finds.length}</div>`+finds.map(f=>{const c=cssv(findState(f).v);
    return `<div class="irow" data-id="${esc(f.id)}"><span class="sd" style="background:${c}"></span><span class="it" title="${esc(f.text)}">${esc(f.id)} ${esc(f.text)}</span></div>`;}).join("");
  let html="";
  for(const b of NMAP.blocks){
    if(b.t==="test") html+=`<h2 class="ntest">${esc(b.text)}</h2>`;
    else if(b.t==="feature") html+=`<h3 class="nfeat">${esc(b.text)}</h3>`;
    else if(b.t==="text") html+=`<p class="ntext">${mdi(b.text)}</p>`;
    else if(b.t==="image"){
      if(b.img) html+=`<img class="nimg" loading="lazy" src="/api/image?path=${encodeURIComponent(b.img)}">`+(b.caption?`<div class="ncap">${esc(b.caption)}</div>`:"");
      else if(b.caption) html+=`<div class="nevi"><span class="evi-ic">📷</span><span>${esc(b.caption)}</span></div>`;
    }
    else if(b.t==="finding"){ const st=findState(b), c=cssv(st.v), ts=findTasks(b.id);
      const sevv=b.sev==="bug"?"--fail":b.sev==="feature"?"--prog":"--queued", sc=cssv(sevv);
      const tasksHtml=ts.length?ts.map(t=>taskRow(t,true)).join(""):`<div class="nnotask">no task recorded yet</div>`;
      // Screenshot evidence for this finding — the actual image when captured,
      // otherwise the tester's description, shown right under the finding.
      const eviHtml=(b.evidence||[]).map(ev=>{
        const img=ev.img?`<img class="nevi-img" loading="lazy" src="/api/image?path=${encodeURIComponent(ev.img)}">`:"";
        const id=ev.ref?`<span class="evi-id">image ${esc(ev.ref)}</span> — `:"";
        const cap=(ev.caption||"")?`<div class="nevi"><span class="evi-ic">📷</span><span>${id}${esc(ev.caption||"")}</span></div>`:"";
        return cap+img;
      }).join("");
      const collapsed = COLLAPSED.has(b.id) ? " collapsed" : "";
      html+=`<div class="nfind${collapsed}" id="find-${esc(b.id)}" data-covlabel="${esc(st.l)}" style="border-left-color:${c}">
        <div class="nfh" onclick="toggleFind('${esc(b.id)}')" title="click to collapse / expand">
          <span class="chev">▾</span>
          <span class="sevtag" style="color:${sc};background:${sc}22">${esc(b.sev||b.kind)} ${esc(b.id)}</span>
          ${pipelineRow(st.l)}</div>
        <div class="nbody"><div class="nft">${mdi(b.text)}</div>${eviHtml}${tasksHtml}</div></div>`;
    }
  }
  if(NMAP.url && /^https?:/i.test(NMAP.url)) html+=`<div style="text-align:center;margin:22px 0 0"><a href="${esc(NMAP.url)}" target="_blank">open the source doc ↗</a></div>`;

  // Pending questions ride at the very top — they block a run and need you now.
  const qHtml=QUESTIONS.length
    ? `<div class="qwrap"><div class="qhead">Needs your input · ${QUESTIONS.length}</div>${QUESTIONS.map(questionCard).join("")}</div>` : "";
  // Tasks not tied to any finding still surface here, so nothing is hidden.
  const findIds=new Set((NMAP.findings||[]).map(f=>f.id));
  const other=TASKS.filter(t=>t.status!=="rejected" && !idsOf(t.source).some(id=>findIds.has(id)));
  const otherHtml=other.length
    ? `<div class="ndoc otherdoc"><h2 class="ntest">Other tasks · ${other.length}</h2>${other.map(t=>taskRow(t,false)).join("")}</div>` : "";
  // A daemon restart alone can leave PROGRESS.active stuck true long after the
  // batch is real and running — never let a stale ingest banner cover a board
  // that already has actual tasks on it.
  const hasRealTasks=TASKS.some(t=>t.status!=="rejected");
  const setupHtml = (PROGRESS.active && !hasRealTasks) ? `<div class="setupwrap doc">${setupCard()}</div>` : "";
  stage.innerHTML=setupHtml+qHtml+`<div class="ndoc">${html}</div>`+otherHtml;
  document.querySelectorAll(".irow").forEach(r=>{ r.onclick=()=>{
    const id=r.dataset.id, el=document.getElementById("find-"+id), stage=$("#stage");
    if(!el||!stage) return;
    if(COLLAPSED.has(id)){ COLLAPSED.delete(id); el.classList.remove("collapsed"); }  // expand target
    // Scroll the doc pane (offsetParent is #stage) directly — robust regardless
    // of nested scroll containers.
    stage.scrollTo({top: Math.max(0, el.offsetTop - 14), behavior:"smooth"});
    el.classList.add("flash"); setTimeout(()=>el.classList.remove("flash"), 1300);
    document.querySelectorAll(".irow.on").forEach(x=>x.classList.remove("on")); r.classList.add("on");
  }; });
}

// ---------- Example task-doc viewer: embedded INSIDE the intake question
// card (between its context text and the reply box) so the user sees what a
// task doc looks like without leaving that one card — small, scrollable, like
// flipping through a PDF, never pushing the card off-screen. Read-only: no
// "use this" action, just a preview.
let EXAMPLES=null, EXAMPLES_REQ=false;
async function loadExamples(){
  if(EXAMPLES||EXAMPLES_REQ) return; EXAMPLES_REQ=true;
  try{ EXAMPLES=await api("/api/examples"); }catch(e){ EXAMPLES={findings:[]}; }
  LAST_SIG="";   // re-render now that it's loaded
}
const SEVV={bug:"--fail",feature:"--prog",minor:"--wait",done:"--ready",note:"--queued"};
// Render the demo doc's blocks the SAME way the real doc view does (test/feature
// headings, finding blocks with a severity tag, plain text, image captions) —
// so it reads as one continuous document inside the scrollable frame, not a
// disconnected preview format.
function exampleDocHtml(){
  let html="";
  for(const b of (EXAMPLES.blocks||[])){
    if(b.t==="test") html+=`<h2 class="ntest">${esc(b.text)}</h2>`;
    else if(b.t==="feature") html+=`<h3 class="nfeat">${esc(b.text)}</h3>`;
    else if(b.t==="text") html+=`<p class="ntext">${mdi(b.text)}</p>`;
    else if(b.t==="image" && b.caption) html+=`<div class="nevi"><span class="evi-ic">📷</span><span>${esc(b.caption)}</span></div>`;
    else if(b.t==="finding"){
      const c=cssv(SEVV[b.sev]||"--queued");
      const evi=(b.evidence||[]).filter(e=>e.caption).map(e=>
        `<div class="nevi"><span class="evi-ic">📷</span><span><span class="evi-id">image ${esc(b.id)}</span> — ${esc(e.caption)}</span></div>`).join("");
      html+=`<div class="nfind" style="border-left-color:${c}">
        <div class="nfh"><span class="sevtag" style="color:${c};background:${c}22">${esc(b.sev||b.kind)} ${esc(b.id)}</span></div>
        <div class="nbody"><div class="nft">${mdi(b.text)}</div>${evi}</div></div>`;
    }
  }
  return html;
}
// Called only for the intake question (session_id "manager-intake"). Returns
// "" (and kicks off the load) until the demo doc is fetched — read-only
// preview, no click-to-send action.
function exampleInline(){
  if(!EXAMPLES){ loadExamples(); return ""; }
  if(!(EXAMPLES.findings||[]).length) return "";
  return `<div class="exbox">
    <div class="exbar">📄 ${esc(EXAMPLES.title||"Example task doc")} — what a source doc looks like</div>
    <div class="exframe">${exampleDocHtml()}</div></div>`;
}

// ---------- Plain mode: no doc-map and no PDF (typed-list source, or a file
// the ingest couldn't parse). The board still shows everything that matters:
// the live setup feed, pending questions, and every task grouped by state.
function renderPlain(){
  const live=TASKS.filter(t=>t.status!=="rejected");
  const sig=JSON.stringify(["plain",progSig(),!!EXAMPLES,PAUSED,CAP,COOLDOWN>0,HASWEB,
    QUESTIONS.map(q=>[q.id,q.status,q.answer]),[...REWORK_OPEN],[...TESTPLAN_OPEN],
    TESTSRV&&[TESTSRV.worktree,TESTSRV.backend_up,TESTSRV.web_up,!!TESTSRV.error],
    live.map(t=>[t.id,t.status,t.progress,t.pr_url,t.worktree,t.stopped_reason,t.featuretest,t.test_plan?1:0])]);
  if(sig===LAST_SIG) return; LAST_SIG=sig;
  // Waiting on the user with nothing running yet? Show ONLY the question
  // card(s) — the intake card embeds its own example-doc preview inline.
  if(QUESTIONS.length && !live.length){
    $("#sub").textContent="waiting for you";
    $("#cov").innerHTML=""; $("#index").innerHTML=`<div class="ihead">tasks · 0</div>`;
    $("#stage").innerHTML=`<div class="qwrap">${QUESTIONS.map(questionCard).join("")}</div>`;
    return;
  }
  $("#sub").textContent=live.length?live.length+" tasks":"getting started…";
  const cnt={}; live.forEach(t=>{const l=taskState(t).l; cnt[l]=(cnt[l]||0)+1;});
  const order=["PR ready","in progress","testing","needs you","blocked","failed","queued","draft"];
  const colv={"PR ready":"--ready","in progress":"--prog","testing":"--test","needs you":"--wait","blocked":"--block","failed":"--fail","queued":"--queued","draft":"--queued"};
  $("#cov").innerHTML=order.filter(l=>cnt[l]).map(l=>{const c=cssv(colv[l]);return `<span class="pillc" onclick="cycleCov('${l}')" title="click to step through each ${esc(l)} item" style="color:${c};background:${c}22">${cnt[l]} ${l}</span>`;}).join("");
  $("#index").innerHTML=`<div class="ihead">tasks · ${live.length}</div>`+live.map(t=>{const c=cssv(taskState(t).v);
    return `<div class="irow" data-t="${t.id}"><span class="sd" style="background:${c}"></span><span class="it" title="${esc(t.title)}">${esc(t.title)}</span></div>`;}).join("");
  const buckets=[["In progress",x=>x.status==="running"||x.status==="parked"],
                 ["Stopped — needs your attention",x=>x.status==="failed"],
                 ["PR ready — merge when you're happy",x=>x.status==="done"],
                 ["Queued",x=>x.status==="queued"],
                 ["Waiting on your answer",x=>x.status==="needs_input"],
                 ["Can't be done here",x=>x.status==="blocked"],
                 ["Drafts",x=>x.status==="draft"]];
  let html="";
  for(const [label,f] of buckets){ const ts=live.filter(f); if(!ts.length) continue;
    html+=`<h2 class="ntest">${esc(label)} · ${ts.length}</h2>`+ts.map(t=>
      `<div id="task-${t.id}" data-covlabel="${esc(taskState(t).l)}">${taskRow(t,false)}</div>`).join("");
  }
  if(!html) html=`<p class="ntext" style="color:var(--dim)">No tasks yet — they'll appear here as Claude finishes triage.</p>`;
  // Same rule as the doc view: a stale/stuck progress banner never covers a
  // board that already has real tasks on it.
  const setupHtml=((PROGRESS.steps||[]).length && !live.length)?`<div class="setupwrap doc">${setupCard()}</div>`:"";
  const qHtml=QUESTIONS.length?`<div class="qwrap"><div class="qhead">Needs your input · ${QUESTIONS.length}</div>${QUESTIONS.map(questionCard).join("")}</div>`:"";
  $("#stage").innerHTML=setupHtml+qHtml+`<div class="ndoc">${html}</div>`;
  document.querySelectorAll("#index .irow").forEach(r=>{ r.onclick=()=>{ const el=document.getElementById("task-"+r.dataset.t);
    if(el) $("#stage").scrollTo({top:Math.max(0,el.offsetTop-14),behavior:"smooth"});
    document.querySelectorAll(".irow.on").forEach(x=>x.classList.remove("on")); r.classList.add("on"); }; });
}

async function refresh(){
  if(uiBusy()) return;
  let s; try{ s=await api("/api/state"); }catch(e){ return; }
  if(s.ui_version){ if(UIV===null)UIV=s.ui_version; else if(s.ui_version!==UIV){ location.reload(); return; } }
  if(s.repo_ok===false){ renderSetup(s); return; }   // daemon in setup mode — no repo yet
  TASKS=s.tasks||[];
  TESTSRV=s.test_server||null;
  QUESTIONS=s.pending_questions||[];
  PAUSED=!!s.paused; MANAGER_SESSION=s.manager_session||null;
  if(s.repo) REPO=s.repo;
  if(s.skill_dir) SKILLDIR=s.skill_dir;
  if(s.base_branch) BASEBR=s.base_branch;
  PUSHMODE=s.push_mode||"pr";
  HASWEB=s.has_web_ui;
  CAP=s.cap||1; COOLDOWN=s.cooldown_left||0;
  PROGRESS=s.progress||{steps:[],active:false,done:false};
  renderControls(s);
  LAST_ACTIVE=((s.counts&&((s.counts.running||0)+(s.counts.parked||0)))>0) || PROGRESS.active;
  if(s.notion){ return refreshNotion(); }   // doc-map source (Notion page or ingested .md) → doc mode
  // No doc-map and no PDF (typed-list source, an unparsed file, or still
  // loading): render the PLAIN TASK BOARD — live feed + questions + every task
  // by state. Never strand the user on just the stepper.
  if(!s.source_pdf){ return renderPlain(); }
  const pdf=s.source_pdf;
  if(pdf!==PDF){ PDF=pdf; MAP=null;
    if(PDF){ try{ MAP=await api("/api/pdf-map?path="+encodeURIComponent(PDF)); }catch(e){ MAP=null; } }
    buildStage();
  }
  const sig=JSON.stringify([PDF,MAP&&MAP.sections.length,TASKS.map(t=>[t.id,t.status,t.progress,t.pr_url,t.source,t.title])]);
  if(sig!==LAST_SIG){ LAST_SIG=sig; renderAll(); }
}
async function loop(){
  try{ await refresh(); }catch(e){ console.error("review refresh failed:", e); }  // never let one error kill live updates
  timer=setTimeout(loop, document.hidden?8000:(LAST_ACTIVE?1500:4000));
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden){ clearTimeout(timer); loop(); } });
loop();
</script>
